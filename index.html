  --ink:#EAEAEC; --paper:#26262A; --steel:#9C9CA3; --iron:#1E1E22;
  --line:#454549; --accent:#E19E15; --accent-dark:#F0B23A;
  --green:#3ED480; --green-bg:#1B3327; --amber:#E3B24E; --amber-bg:#3A3018;
  --red:#F2685A; --red-bg:#3A2220; --card:#313135;
}
:root[data-theme="gray"]{
  --ink:#262626; --paper:#E0E0E0; --steel:#6B6B70; --iron:#3A3A3F;
  --line:#C4C4C4; --accent:#E19E15; --accent-dark:#B47E11;
  --green:#1F9D55; --green-bg:#D6E9DC; --amber:#C98A0A; --amber-bg:#EEE0C4;
  --red:#D8402C; --red-bg:#EED5D0; --card:#EFEFEF;
}
:root[data-theme="blue"]{
  --ink:#1F2C33; --paper:#DCE4E8; --steel:#5C7078; --iron:#2C3E4A;
  --line:#BCCAD1; --accent:#E19E15; --accent-dark:#B47E11;
  --green:#1F9D55; --green-bg:#D2E8DC; --amber:#C98A0A; --amber-bg:#E9DEC2;
  --red:#D8402C; --red-bg:#E9D2CE; --card:#EAF0F2;
}
:root[data-theme="navy"]{
  --ink:#E7ECF0; --paper:#1B2430; --steel:#8C9BA8; --iron:#141B24;
  --line:#334352; --accent:#E19E15; --accent-dark:#F0B23A;
  --green:#3ED480; --green-bg:#173327; --amber:#E3B24E; --amber-bg:#332B14;
  --red:#F2685A; --red-bg:#332019; --card:#232E3B;
}
:root[data-theme="dark"] body,:root[data-theme="navy"] body{color-scheme:dark;}
:root[data-theme="dark"] input, :root[data-theme="dark"] select, :root[data-theme="dark"] textarea,
:root[data-theme="gray"] input, :root[data-theme="gray"] select, :root[data-theme="gray"] textarea,
:root[data-theme="blue"] input, :root[data-theme="blue"] select, :root[data-theme="blue"] textarea,
:root[data-theme="navy"] input, :root[data-theme="navy"] select, :root[data-theme="navy"] textarea{
  background:var(--card);color:var(--ink);border-color:var(--line);
}
:root[data-theme="dark"] .btn-outline, :root[data-theme="gray"] .btn-outline, :root[data-theme="blue"] .btn-outline, :root[data-theme="navy"] .btn-outline{background:var(--card);}
:root[data-theme="dark"] .week-item, :root[data-theme="gray"] .week-item, :root[data-theme="blue"] .week-item, :root[data-theme="navy"] .week-item{background:var(--card);}
:root[data-theme="dark"] .role-toggle button, :root[data-theme="gray"] .role-toggle button, :root[data-theme="blue"] .role-toggle button, :root[data-theme="navy"] .role-toggle button{background:var(--card);color:var(--ink);}
*{box-sizing:border-box;}
html{overflow-x:hidden;}
body{margin:0;font-family:'Inter',sans-serif;background:var(--paper);color:var(--ink);overflow-x:hidden;max-width:100vw;}
h1,h2,h3,.display{font-family:'Oswald',sans-serif;letter-spacing:.02em;text-transform:uppercase;}
.mono{font-family:'JetBrains Mono',monospace;}
#app{display:flex;min-height:100vh;}
.sidebar{width:220px;background:var(--iron);color:#EFEDE8;display:flex;flex-direction:column;flex-shrink:0;}
.sidebar .brand{padding:24px 20px 16px;border-bottom:1px solid #3A3D40;}
.sidebar .brand .display{font-size:20px;color:#fff;line-height:1.2;}
.brand-logo{max-width:100%;height:auto;display:block;}
.slant{display:inline-block;transform:skewX(-8deg);}
.login-logo{max-width:220px;height:auto;display:block;margin:0 auto 18px;}
.sidebar .brand .sub{font-size:11px;color:#9A9994;margin-top:4px;letter-spacing:.08em;text-transform:uppercase;}
.nav{padding:12px;flex:1;}
.nav button{width:100%;display:flex;align-items:center;gap:10px;background:none;border:none;color:#C9C7C2;padding:12px 14px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;text-align:left;margin-bottom:4px;font-family:'Inter',sans-serif;}
.nav button .nav-icon{flex-shrink:0;line-height:1;display:flex;}
.nav button .nav-icon svg{width:17px;height:17px;display:block;}
.nav button:hover{background:#2E3134;color:#fff;}
.nav button.active{background:var(--accent);color:#fff;}
.sidebar .foot{padding:16px 20px;border-top:1px solid #3A3D40;}
.main{flex:1;min-width:0;padding:28px 36px 60px;}
.topbar{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:24px;flex-wrap:wrap;gap:12px;}
.topbar h1{font-size:26px;margin:0;color:var(--ink);display:inline-block;transform:skewX(-6deg);}
.topbar .date{color:var(--steel);font-size:13px;margin-top:4px;}
.btn{font-family:'Inter',sans-serif;font-weight:600;font-size:13px;border-radius:8px;padding:10px 18px;border:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover{background:var(--accent-dark);}
.btn-outline{background:#fff;border:1px solid var(--line);color:var(--ink);}
.btn-outline:hover{border-color:var(--steel);}
.btn-ghost{background:none;color:var(--steel);padding:6px 10px;}
.btn-ghost:hover{color:var(--ink);}
.btn-sm{padding:6px 12px;font-size:12px;}
.btn-danger{background:var(--red-bg);color:var(--red);}
.cards-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px;}
.stat-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;}
.stat-card .label{font-size:12px;color:var(--steel);font-weight:600;text-transform:uppercase;letter-spacing:.04em;}
.stat-card .value{font-family:'JetBrains Mono',monospace;font-size:26px;font-weight:700;margin-top:6px;color:var(--ink);}
.mask-value{cursor:pointer;border-bottom:1px dashed var(--steel);}
.stat-card .sub{font-size:12px;color:var(--steel);margin-top:4px;}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:20px;min-width:0;}
.panel h2{font-size:16px;margin:0 0 16px;color:var(--ink);}
.chart-wrap{height:260px;}
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--steel);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;}
td{padding:10px 10px;border-bottom:1px solid #EFEDE8;font-size:14px;white-space:nowrap;}
tr:last-child td{border-bottom:none;}
.search{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
.search input[type=text],.search input[type=month]{padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:'Inter',sans-serif;flex:1;min-width:160px;}
.plates{display:inline-flex;gap:3px;align-items:center;}
.plate{width:9px;height:9px;border-radius:50%;background:var(--accent);}
.plate.empty{background:#E4E0D8;}
.plate-more{font-size:11px;color:var(--steel);margin-left:2px;font-family:'JetBrains Mono',monospace;}
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;}
.badge-green{background:var(--green-bg);color:var(--green);}
.badge-amber{background:var(--amber-bg);color:var(--amber);}
.badge-red{background:var(--red-bg);color:var(--red);}
.badge-gray{background:#EFEDE8;color:var(--steel);}
.row-click{cursor:pointer;}
.row-click:hover{background:#FBFAF7;}
.empty-state{padding:40px 20px;text-align:center;color:var(--steel);font-size:14px;}
.modal-overlay{position:fixed;inset:0;background:rgba(20,19,17,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;}
.modal{background:#fff;border-radius:16px;padding:26px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;}
.modal h3{margin:0 0 18px;font-size:18px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;font-weight:600;color:var(--steel);margin-bottom:5px;text-transform:uppercase;letter-spacing:.03em;}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:'Inter',sans-serif;}
/* iPhone：輸入框字小於 16px 時，點下去 Safari 會自動放大畫面，改成 16px 避免畫面跳動 */
@media (max-width: 768px){ input, select, textarea{ font-size:16px !important; } }
.field-row{display:flex;gap:10px;}
.field-row .field{flex:1;}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;}
.student-detail{display:flex;flex-direction:column;gap:16px;}
.detail-head{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;}
.detail-head h3{margin:0;font-size:20px;}
.detail-head .meta{color:var(--steel);font-size:13px;margin-top:4px;}
.balance-box{display:flex;gap:24px;flex-wrap:wrap;}
.balance-item .n{font-family:'JetBrains Mono',monospace;font-size:26px;font-weight:700;}
.balance-item .l{font-size:11px;color:var(--steel);text-transform:uppercase;}
.hint{font-size:12px;color:var(--steel);margin-top:8px;}
.toast-action{display:flex;align-items:center;gap:14px;font-size:14px;width:max-content;max-width:92vw;text-align:left;}
#toast-root .toast{pointer-events:none;}
#toast-root .toast-action button{pointer-events:auto;}
.toast-action button{white-space:nowrap;flex-shrink:0;background:transparent;border:1px solid rgba(255,255,255,.6);color:#fff;border-radius:6px;padding:7px 14px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;}
.stu-picker-list{max-height:230px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;margin-top:6px;background:var(--card);}
.stu-picker-head{font-size:11px;color:var(--steel);padding:6px 12px 2px;font-weight:700;}
.stu-picker-item{display:flex;align-items:center;gap:6px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 12px;font-size:14px;color:var(--ink);cursor:pointer;font-family:inherit;}
.stu-picker-item:last-child{border-bottom:0;}
.stu-picker-item:hover,.stu-picker-item:active{background:var(--amber-bg);}
.stu-chosen-box{display:flex;align-items:center;gap:8px;border:1px solid var(--accent);border-radius:8px;padding:9px 12px;background:var(--amber-bg);}
.stu-chosen-box .btn{margin-left:auto;}
.wd-row{display:flex;gap:6px;flex-wrap:wrap;}
.wd-chip{display:inline-flex !important;align-items:center;justify-content:center;cursor:pointer;margin:0 !important;}
.wd-chip input{display:none;}
.wd-chip span{display:inline-block;min-width:38px;text-align:center;padding:8px 0;border:1px solid var(--line);border-radius:8px;font-size:14px;color:var(--ink);background:var(--card);}
.wd-chip input:checked + span{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700;}
.chip-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:-6px 0 14px;}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:7px 13px;font-size:13px;cursor:pointer;font-family:inherit;}
.chip.active{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:700;}
.chip-select{border:1px solid var(--line);border-radius:20px;padding:7px 10px;font-size:13px;background:var(--card);color:var(--ink);font-family:inherit;margin-left:auto;}
.quick-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px;}
.quick-actions .btn{padding:14px 6px;font-size:15px;justify-content:center;}
.quick-actions .btn[disabled]{opacity:.45;cursor:not-allowed;}
.todo-sec{margin-top:14px;}
.todo-sec:first-of-type{margin-top:4px;}
.todo-sec h3{font-size:13px;color:var(--steel);margin:0 0 4px;display:flex;align-items:center;gap:6px;}
.todo-row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.todo-row:last-child{border-bottom:0;}
.todo-row .who{flex:1;min-width:140px;font-size:14px;}
.todo-row .who .hint{margin:2px 0 0;}
.todo-row .acts{display:flex;gap:6px;flex-wrap:wrap;}
.roster-sign{min-width:92px;padding:10px 16px;font-size:15px;}
.more-btn{font-size:18px;line-height:1;padding:8px 12px;}
.wd-chip{flex:1;}
.swipe-hint{display:none;}
@media (pointer:coarse){ .swipe-hint{display:inline;} }
.wd-chip span{min-width:0;width:100%;}
@media (max-width: 768px){
  #toast-root .toast{bottom:calc(84px + env(safe-area-inset-bottom, 0px));}
}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 22px;border-radius:10px;font-size:13px;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:80vw;text-align:center;}
.export-actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center;}

.rs-chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 10px;font-size:14px;cursor:pointer;text-align:center;line-height:1.25;font-family:inherit;}
.rs-chip small{display:block;font-size:11px;opacity:.75;}
.rs-chip.on{background:var(--accent);border-color:var(--accent);color:#171614;font-weight:700;}
.rs-chip.busy{color:var(--steel);border-style:dashed;}
.rs-chip.busy.on{color:#171614;}
.rs-times{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px;max-height:230px;overflow:auto;padding:2px;}
.rs-times .rs-chip{width:100%;}
.rs-chip small:empty{display:none;}
.rs-preview{margin:10px 0;padding:10px 12px;border-radius:10px;background:var(--paper);font-size:15px;}
</style>

<script>
/* ---------------- 狀態 & 儲存 ---------------- */
const state = { students: [], coaches: [], purchases: [], checkins: [], schedules: [], packageTemplates: [], settings: { coachPassword: '0000', sessionDurationMinutes: 60, defaultCommissionRate: 50 }, loaded: false, tab: 'dashboard' };
const genId = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
/* 以「本機（台灣）時區」計算的日期字串 YYYY-MM-DD，所有「今天／本月／某一天」的判斷都用它，避免 UTC 讓早上 8 點前被算成前一天 */
/* 把使用者輸入的文字轉成安全的 HTML（備註含 " < > & 時不會再弄壞畫面或截斷內容） */
function esc(v){ return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
window.addEventListener('offline', ()=>{ try{ toast('📴 目前沒有網路。簽到與修改會先暫存在這支手機，連線後自動上傳（請不要清除瀏覽器資料）'); }catch(e){} });
window.addEventListener('online', ()=>{ try{ toast('📶 已重新連線，暫存的資料正在上傳'); }catch(e){} });
const localDateStr = (d) => { const x = new Date(d); return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'); };
const todayISO = () => localDateStr(new Date());
const fmtDateTime = (d) => new Date(d).toLocaleString('zh-TW',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
const fmtDate = (d) => new Date(d).toLocaleDateString('zh-TW',{month:'2-digit',day:'2-digit'});
const fmtTime = (d) => new Date(d).toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'});
const fmtMoney = (n) => 'NT$' + Math.round(Number(n||0)).toLocaleString('zh-TW');
function maskedSpan(text){
  return `<span class="mask-value" data-value="${esc(text)}" data-revealed="false">＊＊＊＊＊</span>`;
}
function bindMaskedValues(){
  document.querySelectorAll('.mask-value').forEach(el=>{
    el.addEventListener('click', ()=>{
      if(el.dataset.revealed==='true'){ el.textContent = '＊＊＊＊＊'; el.dataset.revealed = 'false'; }
      else { el.textContent = el.dataset.value; el.dataset.revealed = 'true'; }
    });
  });
}
function checkinProofHtml(c){
  const sig = getSigSync(c);
  if(sig) return `<img class="sig-thumb" src="${sig}">`;
  if(c.hasSig){
    queueHydrateSigs();
    return `<img class="sig-thumb sig-lazy" data-sig-id="${c.id}" alt="載入中" style="width:80px;" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==">`;
  }
  if(c.backfill) return '<span class="badge badge-amber">補簽到</span>';
  return '<span class="badge badge-green">📷 QR 簽到</span>';
}

const LS_PREFIX = 'coachops_v1_';
// 預設的 Firebase 專案（系統管理者自己的）。其他教練可在登入頁選「使用自己的 Firebase」貼上自己的設定，
// 設定只存在各自的裝置，資料會完全存在他們自己的 Firebase，不會經過管理者的專案。
const DEFAULT_FIREBASE_CONFIG = {
  apiKey: "AIzaSyCMMqlCK2JghfDvqWK1RZKtE6sPZbnOVw0",
  authDomain: "pupie-coach.firebaseapp.com",
  projectId: "pupie-coach",
  storageBucket: "pupie-coach.firebasestorage.app",
  messagingSenderId: "735710150681",
  appId: "1:735710150681:web:8a2b6bf012d282a639aa88"
};
const FB_CFG_KEYS = ['apiKey','authDomain','projectId','storageBucket','messagingSenderId','appId'];
const FB_CFG_LS_KEY = 'pupie_fb_config';
function b64urlEncodeObj(obj){ return btoa(unescape(encodeURIComponent(JSON.stringify(obj)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function b64urlDecodeObj(s){
  let t = String(s||'').replace(/-/g,'+').replace(/_/g,'/');
  while(t.length % 4) t += '=';
  return JSON.parse(decodeURIComponent(escape(atob(t))));
}
function sanitizeFbConfig(o){
  if(!o || typeof o!=='object') return null;
  const out = {};
  FB_CFG_KEYS.forEach(k=>{ if(typeof o[k]==='string') out[k] = o[k].trim(); });
  if(!out.apiKey || !out.projectId || !out.appId) return null;
  if(!/^AIza[0-9A-Za-z_-]{20,}$/.test(out.apiKey)) return null;
  if(!/^[a-z0-9][a-z0-9-]*$/.test(out.projectId)) return null;
  if(!out.authDomain) out.authDomain = out.projectId + '.firebaseapp.com';
  return out;
}
/* 從使用者貼上的文字（Firebase 後台給的 firebaseConfig 那一段）解析出設定 */
function parseFbConfigText(text){
  const t = String(text||'');
  const out = {};
  FB_CFG_KEYS.forEach(k=>{
    const m = t.match(new RegExp('["\']?'+k+'["\']?\\s*:\\s*["\']([^"\']+)["\']'));
    if(m) out[k] = m[1];
  });
  return sanitizeFbConfig(out);
}
function loadCustomFbConfig(){
  try{ const raw = localStorage.getItem(FB_CFG_LS_KEY); return raw ? sanitizeFbConfig(JSON.parse(raw)) : null; }catch(e){ return null; }
}
/* 網址帶 ?setup=… 時，把設定存進這台裝置（換手機用），然後把網址清乾淨 */
(function(){
  try{
    const p = new URLSearchParams(location.search);
    const s = p.get('setup');
    if(s){
      const cfg = sanitizeFbConfig(b64urlDecodeObj(s));
      if(cfg) localStorage.setItem(FB_CFG_LS_KEY, JSON.stringify(cfg));
      history.replaceState(null, '', location.pathname);
    }
  }catch(e){}
})();
const FIREBASE_CONFIG = (function(){
  try{
    const p = new URLSearchParams(location.search);
    if(p.get('student')){
      // 學生自助頁：使用連結裡帶的設定（沒有就用預設）
      const c = p.get('cfg');
      const cfg = c ? sanitizeFbConfig(b64urlDecodeObj(c)) : null;
      return cfg || DEFAULT_FIREBASE_CONFIG;
    }
  }catch(e){}
  return loadCustomFbConfig() || DEFAULT_FIREBASE_CONFIG;
})();
const usingCustomFbConfig = (FIREBASE_CONFIG !== DEFAULT_FIREBASE_CONFIG);
function firebaseConfigured(){ return !!(FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.apiKey.indexOf('PASTE_')!==0); }
function hasClaudeStorage(){ return typeof window.storage !== 'undefined' && window.storage && typeof window.storage.get === 'function'; }
let fbDb = null, fbReady = false, fbUser = null;
let skipFacelockOnce = false;
const fbUnsubscribers = [];
function initFirebaseApp(){
  if(typeof firebase === 'undefined' || !firebaseConfigured()) return false;
  try{
    if(!firebase.apps || !firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    fbDb = firebase.firestore();
    if(!window.__fbPersistTried){
      window.__fbPersistTried = true;
      // 開啟離線暫存：網路不穩時簽到會先存在這支手機，連線後自動上傳
      try{ fbDb.enablePersistence({ synchronizeTabs: true }).catch(e=>console.warn('離線暫存未啟用', e && e.code)); }catch(e){}
    }
    return true;
  }catch(e){ console.warn('Firebase 初始化失敗', e); return false; }
}
function fbDocRef(key){ return fbDb.collection('users').doc(fbUser.uid).collection('data').doc(key); }
async function persistGet(key){
  if(fbReady && fbUser){
    try{ const snap = await fbDocRef(key).get(); return snap.exists ? snap.data().value : null; }catch(e){ /* 退回本機儲存 */ }
  }
  if(hasClaudeStorage()){
    try{ const r = await window.storage.get(key, true); return r ? JSON.parse(r.value) : null; }catch(e){ /* 退回本機儲存 */ }
  }
  try{ const raw = localStorage.getItem(LS_PREFIX+key); return raw!==null ? JSON.parse(raw) : null; }catch(e){ return null; }
}
const PERSIST_KEYS = ['students','coaches','purchases','checkins','schedules','settings','packageTemplates'];
const cloudConfirmed = {};   // 各份資料是否已經確實從雲端讀到（避免離線時把「空資料」寫回雲端）
let lastCloudErrToast = 0;
function reportCloudError(key, e){
  console.warn('雲端儲存失敗', key, e);
  const now = Date.now();
  if(now - lastCloudErrToast < 4000) return;
  lastCloudErrToast = now;

async function persistSet(key, valueObj){

const DEFAULT_SETTINGS = { coachPassword: '0000', sessionDurationMinutes: 60, defaultCommissionRate: 50 };
/* ---------- 資料用量：每份雲端文件上限 1MB ---------- */
const DOC_LIMIT_BYTES = 1048576;
function jsonBytes(v){ try{ return new TextEncoder().encode(JSON.stringify({ value: v })).length; }catch(e){ return JSON.stringify(v||'').length*2; } }
function dataUsageRows(){
  const strip = arr => (arr||[]).map(c=>c && c.signature ? stripSig(c) : c);
  const rows = [
    { label:'學生資料', bytes: jsonBytes(state.students) },
    { label:'購課紀錄', bytes: jsonBytes(state.purchases) },
    { label:'教練、設定、方案範本', bytes: Math.max(jsonBytes(state.coaches), jsonBytes(state.settings), jsonBytes(state.packageTemplates)) }
  ];
  [['checkins','簽到紀錄', strip(state.checkins)], ['schedules','課表', state.schedules]].forEach(([key,label,arr])=>{
    const g = groupByMonth(key, arr);

    Object.keys(g).forEach(ym=>{ const b = jsonBytes(g[ym]); if(b>max){ max = b; maxYm = ym; } });

}
function dataUsageHtml(){

}

/* ---------- 簽到、課表依月份分開存（Firebase 每份文件上限 1MB，一年後會塞滿） ----------
   文件名稱：checkins_2026-10、schedules_2026-10…；dataIndex 記錄有哪些月份。
   舊的 checkins／schedules 單一文件搬完後保留不刪，當作備份。 */
const SPLIT_KEYS = ['checkins','schedules'];
const SPLIT_DATE_FIELD = { checkins:'timestamp', schedules:'datetime' };
const DATA_INDEX_DOC = 'dataIndex';
let dataIndex = null;
const monthData = { checkins:{}, schedules:{} };
const monthSavedJSON = { checkins:{}, schedules:{} };
const monthSubs = {};
let syncStatus = null;
function splitDocId(key, ym){ return key+'_'+ym; }

function splitMonthsOf(key){ return (dataIndex && Array.isArray(dataIndex[key])) ? dataIndex[key].slice() : []; }
function subscribeMonthDoc(key, ym, onFirst){
  const id = splitDocId(key, ym);
  if(monthSubs[id]){ if(onFirst) onFirst(); return; }
  let first = true;
  const done = ()=>{ if(first){ first = false; if(onFirst) onFirst(); } };
  monthSubs[id] = fbDocRef(id).onSnapshot(snap=>{
    if(snap.metadata.fromCache && !snap.exists){ if(first) setTimeout(done, 3500); return; }
    if(!snap.exists && monthSavedJSON[key][ym]!==undefined){ done(); return; }   // 剛新增的月份，自己的寫入還在路上
    const val = snap.exists ? (snap.data().value || []) : [];
    const js = stableJSON(val);
    const wasFirst = first;
    if(monthSavedJSON[key][ym] === js){ done(); return; }   // 自己剛存的資料傳回來
    monthSavedJSON[key][ym] = js;
    monthData[key][ym] = val;
    if(wasFirst){ done(); return; }
    // 別台裝置改了這個月：只替換這個月的資料，其他月份不動
    state[key] = state[key].filter(it=>itemMonth(key, it)!==ym).concat(val);
    if(state.loaded) cloudRender();
  }, err=>{ console.warn(err); done(); });
  fbUnsubscribers.push(()=>{ try{ monthSubs[id](); }catch(e){} delete monthSubs[id]; });
}
function ensureMonthListeners(){ SPLIT_KEYS.forEach(key=>splitMonthsOf(key).forEach(ym=>subscribeMonthDoc(key, ym))); }
/* 第一次使用新版：把舊的單一文件拆成每月文件（一次寫入，全部成功或全部不寫） */
async function migrateToMonthlyDocs(){
  const legacy = {}, ts = {};
  for(const key of SPLIT_KEYS){
    let snap;
    try{ snap = await fbDocRef(key).get({ source:'server' }); }
    catch(e){ console.warn('搬移前讀取失敗', e); return false; }
    legacy[key] = snap.exists ? (snap.data().value || []) : [];
    ts[key] = snap.exists ? (snap.data().updatedAt || 0) : 0;
  }
  const now = Date.now();
  const idx = { v: 1, migratedAt: now, legacyMerged: { checkins: ts.checkins, schedules: ts.schedules }, checkins: [], schedules: [] };
  const batch = fbDb.batch();
  SPLIT_KEYS.forEach(key=>{
    const g = groupByMonth(key, legacy[key]);
    Object.keys(g).sort().forEach(ym=>{ batch.set(fbDocRef(splitDocId(key, ym)), { value: g[ym], updatedAt: now }); idx[key].push(ym); });
  });
  batch.set(fbDocRef(DATA_INDEX_DOC), { value: idx, updatedAt: now });
  try{ await batch.commit(); return true; }
  catch(e){ reportCloudError('資料搬移', e); return false; }
}
/* 還沒重新整理的舊版裝置，可能還在寫舊的單一文件：把它新增的資料自動併進來 */
function watchLegacyDoc(key){
  const handle = (snap)=>{
    if(!snap.exists || snap.metadata.fromCache) return;
    if(!state.loaded || !dataIndex){ setTimeout(()=>handle(snap), 1500); return; }
    const upd = snap.data().updatedAt || 0;
    const merged = (dataIndex.legacyMerged && dataIndex.legacyMerged[key]) || 0;
    if(upd <= merged) return;
    const have = new Set(state[key].map(x=>x.id));
    const extra = (snap.data().value || []).filter(x=>x && x.id && !have.has(x.id));
    dataIndex.legacyMerged = Object.assign({}, dataIndex.legacyMerged, { [key]: upd });
    fbDocRef(DATA_INDEX_DOC).set({ value: { legacyMerged: { [key]: upd } } }, { merge: true }).catch(()=>{});
    if(extra.length){
      state[key] = state[key].concat(extra);
      (key==='checkins' ? saveCheckins() : saveSchedules());
      if(state.loaded) cloudRender();
      toast('偵測到舊版畫面新增了 '+extra.length+' 筆'+(key==='checkins'?'簽到':'排課')+'，已自動併入。請把每台手機、電腦都重新整理一次');
    }
  };
  const unsub = fbDocRef(key).onSnapshot(handle, ()=>{});
  fbUnsubscribers.push(unsub);
}
/* 存簽到／課表：只寫有變動的月份 */
async function persistSplit(key, arr){
  if(!(fbReady && fbUser)) return persistSet(key, arr);
  if(!cloudConfirmed[key] || !dataIndex){
    toast('尚未連上雲端，為避免覆蓋舊資料，這次變更先不儲存。請等連線後再操作一次');
    return false;
  }
  const groups = groupByMonth(key, arr);
  const known = splitMonthsOf(key);
  const months = Array.from(new Set(known.concat(Object.keys(groups)))).sort();
  const newMonths = months.filter(ym=>known.indexOf(ym)<0);
  const writes = [];
  const now = Date.now();
  months.forEach(ym=>{
    const val = groups[ym] || [];
    const js = stableJSON(val);
    if(monthSavedJSON[key][ym] === js) return;
    monthSavedJSON[key][ym] = js;
    monthData[key][ym] = val;
    writes.push(fbDocRef(splitDocId(key, ym)).set({ value: val, updatedAt: now }));
  });
  if(newMonths.length){
    dataIndex = Object.assign({}, dataIndex, { [key]: months });
    writes.push(fbDocRef(DATA_INDEX_DOC).set({ value: { [key]: firebase.firestore.FieldValue.arrayUnion.apply(null, newMonths) }, updatedAt: now }, { merge: true }));
    newMonths.forEach(ym=>subscribeMonthDoc(key, ym));
  }
  if(writes.length===0) return true;
  const p = Promise.all(writes);
  p.catch(e=>reportCloudError(key, e));
  const r = await Promise.race([p.then(()=>'ok', ()=>'err'), new Promise(res=>setTimeout(()=>res('pending'), 6000))]);
  if(r==='err') return false;
  if(r==='pending') toast('目前網路不穩，已先暫存在這支手機，連線後會自動上傳');
  return true;
}
/* 讀取每月文件與索引；回傳時 state.checkins／state.schedules 已組好 */
function loadSplitData(){
  return new Promise(resolve=>{
    let first = true, migrating = false;
    const finishWith = ()=>{
      const ms = SPLIT_KEYS.reduce((a,key)=>a.concat(splitMonthsOf(key).map(ym=>[key,ym])), []);
      let left = ms.length;
      const fin = ()=>{
        SPLIT_KEYS.forEach(key=>{ state[key] = splitMonthsOf(key).reduce((a,ym)=>a.concat(monthData[key][ym]||[]), []); cloudConfirmed[key] = true; });
        resolve();
      };
      if(left===0){ fin(); return; }
      ms.forEach(([key,ym])=>subscribeMonthDoc(key, ym, ()=>{ if(--left===0) fin(); }));
    };
    const unsub = fbDocRef(DATA_INDEX_DOC).onSnapshot(async snap=>{
      if(snap.metadata.fromCache && !snap.exists){
        if(first) setTimeout(()=>{ if(first){ first = false; SPLIT_KEYS.forEach(k=>{ state[k] = []; }); resolve(); } }, 3500);
        return;
      }
      if(!snap.exists){
        if(migrating) return;
        migrating = true;
        toast('系統升級中：正在把簽到與課表整理成每月一份（只需要一次）…');
        const ok = await migrateToMonthlyDocs();
        migrating = false;
        if(!ok && first){ first = false; SPLIT_KEYS.forEach(k=>{ state[k] = []; }); resolve(); toast('資料整理失敗，請確認網路後重新整理頁面'); }
        return;   // 成功的話索引文件會再傳一次 snapshot
      }
      const val = snap.data().value || {};
      dataIndex = Object.assign({ checkins: [], schedules: [] }, val);
      if(first){ first = false; finishWith(); }
      else { ensureMonthListeners(); }
    }, err=>{ console.warn(err); if(first){ first = false; resolve(); } });
    fbUnsubscribers.push(unsub);
  });
}
async function loadAll(){

    state.purchases = (await persistGet('purchases')) || [];
    state.checkins = (await persistGet('checkins')) || [];
    state.schedules = (await persistGet('schedules')) || [];

  if(state.settings.defaultCommissionRate===undefined) state.settings.defaultCommissionRate = 50;
  if(state.settings.monthlyReportWebAppUrl===undefined) state.settings.monthlyReportWebAppUrl = '';
  if(!state.packageTemplates) state.packageTemplates = [];

}

/* ---------- 簽名圖獨立儲存（避免「簽到紀錄」單一文件超過 1MB 上限） ---------- */

/* ---------------- 衍生計算 ---------------- */
/* 從文字判斷課程類型：支援「一對一、1v1、1V1、1對1、1:1、1-1、1on1、個人」與「一對二、1v2、1對2、1:2、雙人」等寫法；判斷不出來回傳空字串 */
function detectCourseType(text){
  const n = String(text||'').toLowerCase();
  if(!n.trim()) return '';
  /* 「1v1 12堂」「6堂1v2」「1對1」「一對二」「1 on 1」；數字後面緊接堂數（例如 1v112堂）也認得 */
  const m = n.match(/(?<!\d)[1一壹]\s*(?:vs|v|對|对|:|：|x|×|\*|-|－|on|to|比)\s*(?:([一二兩两])|([12])(?:(?!\d)|(?=\d+\s*堂)))/);
  if(m){ const k = m[1] || m[2]; return (k==='1'||k==='一') ? '一對一' : '一對二'; }
  if(/雙人|双人|兩人|两人|二人|duo|pair/.test(n)) return '一對二';
  if(/個人|个人|私人|單人|单人|personal/.test(n)) return '一對一';
  return '';
}
/* 每份合約一定有課程類型：有設定就用設定的，沒有就看方案名稱，再判斷不出來就當作一對一 */

let inlineQRScanner = null;
function startInlineQRScan(inputId){
  const area = document.getElementById('qrcode-scan-area');

  QrScanner.WORKER_PATH = 'https://cdnjs.cloudflare.com/ajax/libs/qr-scanner/1.4.2/qr-scanner-worker.min.js';
  inlineQRScanner = new QrScanner(video, result => {
    const text = typeof result === 'string' ? result : result.data;

function calcAge(birthday){
  if(!birthday) return '';
  const b = new Date(birthday); const n = new Date();
  let age = n.getFullYear()-b.getFullYear();
  if(n.getMonth()<b.getMonth() || (n.getMonth()===b.getMonth() && n.getDate()<b.getDate())) age--;
  return age;
}

function soleCoachId(){ return state.coaches.length===1 ? state.coaches[0].id : null; }
function scheduleClashes(sid, coachId, startMs, durMin, excludeId){
  const end = startMs + (Number(durMin)||60)*60000;
  const ec = coachId || soleCoachId();
  return state.schedules.filter(sc=>{
    if(sc.id===excludeId || sc.status==='cancelled' || sc.status==='leave') return false;
    const sameStu = sc.studentId===sid;
    const sameCoach = !!ec && (sc.coachId || soleCoachId())===ec;
    if(!sameStu && !sameCoach) return false;
    const s0 = new Date(sc.datetime).getTime(), s1 = s0 + (Number(sc.durationMinutes)||60)*60000;
    return s0 < end && startMs < s1;
  });
}

/* 排課的提醒：堂數不夠、撞時間。newCount = 這次會多用掉幾堂 */
function scheduleGuardMessages(sid, coachId, dates, dur, excludeId, newCount){
  const msgs = [];
  if(!sid || !dates.length) return msgs;
  if(newCount > 0){
    const st = studentStats(sid); const pend = pendingScheduledCount(sid, excludeId); const free = st.remaining - pend;

      msgs.push({ cls:'red', html:`<strong>⚠ ${nm} 剩 ${st.remaining} 堂${pend ? '，而且已經排了 '+pend+' 堂還沒上' : ''}</strong><div>${newCount===1 ? '這堂課' : '其中 '+over+' 堂'}會超過剩餘堂數，上完會變成欠堂。記得提醒學生續約。</div>` });

  if(clashes.length) msgs.push({ cls:'amber', html:`<strong>⚠ 時間撞到了</strong><div>${clashListHtml(clashes, sid)}</div>` });

function studentSpend(id){ return state.purchases.filter(p=>p.studentId===id).reduce((a,p)=>a+Number(p.price||0),0); }
function packageCheckinCount(purchaseId){ return state.checkins.filter(c=>c.purchaseId===purchaseId).length; }
function packageUsed(purchaseId){ const p = findPurchase(purchaseId); return packageCheckinCount(purchaseId) + (p ? (Number(p.usedBefore)||0) : 0); }
/* 已實現的金額：已簽到的堂數（用簽到當時鎖定的單價）＋舊資料已上堂數（用當時單價） */
function recognizedValue(p){
  const sum = state.checkins.filter(c=>c.purchaseId===p.id).reduce((a,c)=>a+Number(c.unitPrice||0),0);
  const ub = Number(p.usedBefore)||0;
  const ubUnit = (p.usedBeforeUnit!=null && p.usedBeforeUnit!=='') ? Number(p.usedBeforeUnit) : Number(p.unitPrice)||0;
  return sum + ub*ubUnit;
}
/* 升級後：沒上的堂數單價 =（新總金額 − 已實現金額）÷ 剩餘堂數，過去簽到的單價完全不動 */
function refreshPurchaseUnitPrice(p){
  const rem = packageRemaining(p);
  if(rem > 0) p.unitPrice = Math.max(0, (Number(p.price) - recognizedValue(p)) / rem);
  else p.unitPrice = Number(p.price) / Number(p.sessions);
}
/* 銷售額明細：舊資料不計入；升級補差額記在升級那一天 */
function salesEntries(p){
  const fee = Number(p.upgradeFee)||0;
  const out = [];
  if(!p.legacy){
    const baseSessions = Number(p.sessions) - (p.upgrade ? Number(p.upgrade.extra)||0 : 0);
    out.push({ date: p.purchaseDate, amount: Number(p.price||0) - fee, sessions: baseSessions, label: p.packageName });
  }
  if(fee > 0 && p.upgradeDate){
    out.push({ date: p.upgradeDate, amount: fee, sessions: p.upgrade ? Number(p.upgrade.extra)||0 : 0, label: '升級補差額：' + (p.upgrade ? (p.upgrade.fromSessions+'→'+p.upgrade.toSessions+'堂') : p.packageName) });
  }
  return out;
}
function allSalesEntries(){
  const out = [];
  state.purchases.forEach(p=>salesEntries(p).forEach(e=>out.push(Object.assign({ purchase: p }, e))));
  return out;
}
function salesInMonth(ym){ return allSalesEntries().filter(e=>String(e.date).slice(0,7)===ym).reduce((a,e)=>a+e.amount,0); }
/* 標準升級價目（一份合約只能升級一次）。有折扣時，升級視窗裡可以手動改金額 */
const UPGRADE_TABLE = {
  '一對一': [ {from:6,to:12,fee:8400}, {from:6,to:18,fee:16200}, {from:12,to:18,fee:7800} ],
  '一對二': [ {from:6,to:12,fee:10800} ]
};
function packageRemaining(p){ return Number(p.sessions) - packageUsed(p.id); }
// FIFO：找出該學生最早、還有剩餘堂數的購課方案
function allocatePurchase(studentId){
  const list = state.purchases.filter(p=>p.studentId===studentId).sort((a,b)=>a.purchaseDate.localeCompare(b.purchaseDate));
  for(const p of list){ if(packageRemaining(p) > 0) return p; }
  return null;
}
/* 學生堂數用完後仍簽到（透支），簽到會先掛在「沒有方案」；新買方案後，自動把這些簽到歸入最早有餘額的方案 */
function reconcileOrphanCheckins(studentId){
  const orphans = state.checkins.filter(c=>c.studentId===studentId && !c.purchaseId).sort((a,b)=>a.timestamp.localeCompare(b.timestamp));
  let changed = 0;
  for(const c of orphans){
    const p = allocatePurchase(studentId);
    if(!p) break;
    c.purchaseId = p.id;
    if(!Number(c.unitPrice)){   // 當時完全沒有方案可參考（單價 0）→ 用實際方案補上單價與抽成
      c.unitPrice = Number(p.unitPrice)||0;
      c.commissionRate = getCommissionRate(p, c.coachId);
      c.commissionAmount = c.unitPrice * c.commissionRate / 100;
    }
    changed++;
  }
  return changed;
}
function getCommissionRate(purchase, coachId){
  if(purchase && purchase.commissionRateOverride!==null && purchase.commissionRateOverride!==undefined && purchase.commissionRateOverride!=='') return Number(purchase.commissionRateOverride);
  const coach = findCoach(coachId);
  if(coach && coach.defaultCommissionRate!=null) return Number(coach.defaultCommissionRate);
  return Number(state.settings.defaultCommissionRate)||0;
}

function stableJSON(v){ return JSON.stringify(v, (key, val)=> (val && typeof val==='object' && !Array.isArray(val)) ? Object.keys(val).sort().reduce((o,kk)=>{ o[kk]=val[kk]; return o; }, {}) : val); }
let pendingCloudRender = false;
function cloudRender(){
  const a = document.activeElement, views = document.getElementById('views');
  const typing = a && views && views.contains(a) && (a.tagName==='INPUT' || a.tagName==='TEXTAREA' || a.tagName==='SELECT');

}

function getUpcomingBirthdays(daysAhead){
  daysAhead = daysAhead===undefined ? 7 : daysAhead;
  const now = new Date();
  const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const results = [];
  activeStudents().forEach(s=>{
    if(!s.birthday) return;
    const b = new Date(s.birthday);
    if(isNaN(b.getTime())) return;
    let occurrence = new Date(todayStart.getFullYear(), b.getMonth(), b.getDate());
    if(occurrence < todayStart) occurrence = new Date(todayStart.getFullYear()+1, b.getMonth(), b.getDate());
    const diffDays = Math.round((occurrence - todayStart) / 86400000);
    if(diffDays <= daysAhead){
      results.push({ student: s, occurrence, diffDays, turningAge: occurrence.getFullYear() - b.getFullYear() });
    }
  });
  results.sort((a,b)=>a.diffDays-b.diffDays);
  return results;
}
function renderBirthdayHtml(list){
  if(list.length===0) return '<div class="empty-state">近期沒有學生生日</div>';
  return list.map(u=>{
    const label = u.diffDays===0 ? '🎉 今天' : (u.diffDays===1 ? '明天' : `${u.diffDays} 天後`);
    const dateStr = `${u.occurrence.getMonth()+1}/${u.occurrence.getDate()}`;
    return `<div class="sched-item">
      <div style="flex:1;"><strong>${esc(u.student.name)}</strong><span class="hint" style="margin-left:8px;">滿 ${u.turningAge} 歲</span></div>
      <span class="mono" style="margin-right:8px;color:var(--steel);">${dateStr}</span>
      <span class="badge ${u.diffDays===0?'badge-green':'badge-amber'}">${label}</span>
    </div>`;
  }).join('');
}

  const body = sec('📅','今天的課', todayList.length, todayRows || '')

}
/* 把沒有指定教練的簽到補上教練，並用那位教練（或購課設定）的抽成比例重算 */
function assignCoachToUnassigned(coachId){
  const list = state.checkins.filter(c=>!c.coachId);
  let fixedSc = 0;
  list.forEach(c=>{
    const p = findPurchase(c.purchaseId);
    c.coachId = coachId;
    c.commissionRate = getCommissionRate(p, coachId);
    c.commissionAmount = Number(c.unitPrice||0) * c.commissionRate / 100;
    const sc = c.scheduleId ? state.schedules.find(x=>x.id===c.scheduleId) : null;
    if(sc && !sc.coachId){ sc.coachId = coachId; fixedSc++; }
  });
  saveCheckins(); if(fixedSc) saveSchedules();
  return list.length;
}

function bindDashboardTodo(){
  const box = document.getElementById('dash-todo'); if(!box) return;
  box.querySelectorAll('[data-todo]').forEach(b=>b.addEventListener('click', ()=>{
    const id = b.dataset.id, act = b.dataset.todo;
    if(act==='sign') openScheduleSignModal(id);
    else if(act==='more') openWeekItemActionModal(id);
    else if(act==='backfill') openBackfillCheckinModal(id);
    else if(act==='open'){ state.tab = 'students'; renderNav(); openStudentDetail(id); }
    else if(act==='fix-coach'){ openFixCoachModal(); }
    else if(act==='goto-settings'){ switchTab('settings'); }
    else if(act==='snooze-renew'){ const s = findStudent(id); if(!s) return; s.renewSnooze = studentStats(id).purchased; saveStudents(); renderView(); toast('已略過 '+s.name+'，之後有新購課會重新判斷'); }
    else if(act==='paid'){
      const p = findPurchase(id); if(!p) return;

let dashChartInstance = null;
let dashDayPage = Math.floor((new Date().getDate()-1)/5);
function shiftDayPage(delta){ dashDayPage += delta; drawDashboardChart(); }
function drawDashboardChart(){
  const canvas = document.getElementById('dash-chart');
  if(canvas){
    const now = new Date();
    const daysInMonth = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
    const ym = localDateStr(now).slice(0,7);
    const perDay = {};
    state.checkins.filter(c=>localDateStr(c.timestamp).slice(0,7)===ym).forEach(c=>{
      const day = new Date(c.timestamp).getDate();
      perDay[day] = (perDay[day]||0) + 1;
    });
    const totalPages = Math.ceil(daysInMonth/5);
    if(dashDayPage < 0) dashDayPage = 0;
    if(dashDayPage > totalPages-1) dashDayPage = totalPages-1;
    const startDay = dashDayPage*5 + 1;
    const endDay = Math.min(startDay+4, daysInMonth);
    const labels = []; const counts = [];
    for(let d=startDay; d<=endDay; d++){ labels.push(d+'日'); counts.push(perDay[d]||0); }
    const label = document.getElementById('day-range-label');
    if(label) label.textContent = `${now.getMonth()+1}/${startDay} - ${now.getMonth()+1}/${endDay}`;
    const prevBtn = document.getElementById('btn-day-prev'); if(prevBtn) prevBtn.disabled = dashDayPage<=0;
    const nextBtn = document.getElementById('btn-day-next'); if(nextBtn) nextBtn.disabled = dashDayPage>=totalPages-1;
    if(dashChartInstance){ try{ dashChartInstance.destroy(); }catch(e){} dashChartInstance = null; }
    if(typeof Chart === 'undefined'){ canvas.insertAdjacentHTML('afterend','<div class="hint" style="text-align:center;">圖表元件載入失敗，請重新整理（不影響其他功能）</div>'); canvas.remove(); renderRevenueTreemap(); return; }
    dashChartInstance = new Chart(canvas, { type:'bar', data:{ labels, datasets:[{ data: counts, backgroundColor:'#E19E15', borderRadius:6, maxBarThickness:60 }] }, options:{ plugins:{legend:{display:false}}, scales:{ y:{beginAtZero:true, ticks:{precision:0}}, x:{grid:{display:false}} } } });
  }
  renderRevenueTreemap();
}
// 簡易二分切割樹狀圖（binary slice treemap），保證矩形無重疊無空隙
function treemapLayout(items, x, y, w, h, horizontal){
  if(items.length===0) return [];
  if(items.length===1) return [{...items[0], x, y, w, h}];
  const total = items.reduce((a,i)=>a+i.value,0) || 1;
  let acc = 0, splitIdx = 1;
  for(let i=0;i<items.length;i++){ acc += items[i].value; if(acc >= total/2){ splitIdx = i+1; break; } }
  splitIdx = Math.max(1, Math.min(splitIdx, items.length-1));
  const left = items.slice(0, splitIdx), right = items.slice(splitIdx);
  const leftSum = left.reduce((a,i)=>a+i.value,0);
  const ratio = total>0 ? leftSum/total : 0.5;
  if(horizontal){
    const leftW = w*ratio;
    return [...treemapLayout(left, x, y, leftW, h, !horizontal), ...treemapLayout(right, x+leftW, y, w-leftW, h, !horizontal)];
  } else {
    const leftH = h*ratio;
    return [...treemapLayout(left, x, y, w, leftH, !horizontal), ...treemapLayout(right, x, y+leftH, w, h-leftH, !horizontal)];
  }
}
function renderRevenueTreemap(){
  const container = document.getElementById('dash-revenue-treemap');
  if(!container) return;
  const now = new Date();
  const months = [];
  for(let i=5;i>=0;i--){ const d = new Date(now.getFullYear(), now.getMonth()-i, 1); months.push(localDateStr(d).slice(0,7)); }
  const data = months.map(ym => ({ ym, label: ym.slice(5)+'月', value: salesInMonth(ym) }));
  const w = container.clientWidth || 400;
  const h = container.clientHeight || 260;
  const withEpsilon = data.map(d=>({...d, sortValue: d.value>0?d.value:1}));
  const sorted = [...withEpsilon].sort((a,b)=>b.sortValue-a.sortValue).map(d=>({...d, value:d.sortValue}));
  const rects = treemapLayout(sorted, 0, 0, w, h, true);
  const colors = ['#E19E15','#171614','#B47E11','#4A4844','#8C8880','#D8D3C4'];
  container.innerHTML = rects.map(r=>{
    const idx = sorted.findIndex(s=>s.ym===r.ym);
    const color = colors[idx % colors.length];
    const rw = Math.max(r.w-3,0), rh = Math.max(r.h-3,0);
    return `<div style="position:absolute;left:${r.x}px;top:${r.y}px;width:${rw}px;height:${rh}px;background:${color};border-radius:6px;display:flex;flex-direction:column;justify-content:center;align-items:center;color:#fff;overflow:hidden;padding:4px;text-align:center;">
      <div style="font-family:'Oswald',sans-serif;font-size:${rw>60?13:10}px;font-weight:600;">${r.label}</div>
      <div class="mono" style="font-size:${rw>60?12:9}px;">${fmtMoney(r.value)}</div>
    </div>`;
  }).join('');
}

/* 學生詳細頁：左右滑動返回學生列表（手機） */
(function setupSwipeBack(){
  let sx=0, sy=0, st=0, dx=0, mode=null, el=null, sEl=null;
  const views = ()=>document.getElementById('views');
  const scrollableX = (node)=>{ for(let n=node; n && n!==document.body; n=n.parentElement){ if(n.scrollWidth > n.clientWidth + 2){ const ox = getComputedStyle(n).overflowX; if(ox==='auto' || ox==='scroll') return n; } } return null; };
  const active = ()=> state.loaded && state.tab==='students' && !!openStudentId && !document.querySelector('#modal-root .modal');
  document.addEventListener('touchstart', (e)=>{
    mode = null; dx = 0;
    if(!active() || e.touches.length!==1) return;
    const t = e.touches[0], target = e.target;
    if(t.clientX < 24) return;   // 螢幕最左邊交給 iPhone 內建的返回手勢
    if(target.closest('input,textarea,select,canvas')) return;
    sEl = scrollableX(target);
    sx = t.clientX; sy = t.clientY; st = Date.now(); mode = 'wait'; el = views();
  }, { passive:true });
  document.addEventListener('touchmove', (e)=>{
    if(!mode || !el) return;
    const t = e.touches[0]; const mx = t.clientX - sx, my = t.clientY - sy;
    if(mode==='wait'){
      if(Math.abs(mx) < 12 && Math.abs(my) < 12) return;
      if(Math.abs(mx) > Math.abs(my) * 1.4){
        // 在可以左右捲動的表格上：表格還能往那個方向捲，就讓表格捲，不當作返回
        if(sEl){ const atLeft = sEl.scrollLeft <= 0, atRight = sEl.scrollLeft + sEl.clientWidth >= sEl.scrollWidth - 1; if((mx>0 && !atLeft) || (mx<0 && !atRight)){ mode = null; return; } }
        mode = 'swipe'; el.style.transition = 'none';
      }
      else { mode = null; return; }
    }
    dx = mx;
    el.style.transform = `translateX(${dx}px)`;
    el.style.opacity = String(Math.max(0.35, 1 - Math.abs(dx)/window.innerWidth));
  }, { passive:true });
  const finish = ()=>{
    if(mode!=='swipe' || !el){ mode = null; return; }
    const fast = Math.abs(dx) > 40 && (Date.now()-st) < 300;
    const go = Math.abs(dx) > Math.min(110, window.innerWidth*0.28) || fast;
    const node = el; mode = null;
    node.style.transition = 'transform .18s ease, opacity .18s ease';
    if(go){
      node.style.transform = `translateX(${dx>0?'':'-'}${window.innerWidth}px)`; node.style.opacity = '0';
      setTimeout(()=>{ node.style.transition='none'; node.style.transform=''; node.style.opacity=''; backToStudentList(); }, 170);
    } else {
      node.style.transform = ''; node.style.opacity = '';
      setTimeout(()=>{ node.style.transition=''; }, 200);
    }
  };
  document.addEventListener('touchend', finish, { passive:true });
  document.addEventListener('touchcancel', ()=>{ if(el){ el.style.transition=''; el.style.transform=''; el.style.opacity=''; } mode = null; }, { passive:true });
})();

/* ---------------- QR 掃描簽到 ---------------- */
let qrScannerInstance = null;
let lastQRScan = 0;
function openQRScanModal(){
  openModal(`
    <h3>QR 掃描簽到</h3>
    <div class="hint" style="margin-bottom:10px;">請將學生的專屬 QRCode 對準鏡頭</div>
    <div class="sig-pad-wrap"><video id="qr-video" style="width:100%;height:260px;object-fit:cover;display:block;" muted playsinline></video></div>
    <div id="qr-scan-status" class="hint" style="margin-top:10px;">正在啟動相機...</div>
    <div class="modal-actions"><button class="btn btn-outline" id="modal-cancel">取消</button></div>
  `);
  document.getElementById('modal-cancel').addEventListener('click', ()=>{ stopQRScanner(); closeModal(); });
  startQRScanner();
}
function startQRScanner(){
  const video = document.getElementById('qr-video');
  const statusEl = document.getElementById('qr-scan-status');
  if(typeof QrScanner === 'undefined'){ if(statusEl) statusEl.textContent = '掃描元件載入失敗，請改用手寫簽到'; return; }
  QrScanner.WORKER_PATH = 'https://cdnjs.cloudflare.com/ajax/libs/qr-scanner/1.4.2/qr-scanner-worker.min.js';
  qrScannerInstance = new QrScanner(video, result => {
    const text = typeof result === 'string' ? result : result.data;
    handleQRDecoded(text);
  }, { highlightScanRegion:true, highlightCodeOutline:true, maxScansPerSecond:5 });
  qrScannerInstance.start()
    .then(()=>{ if(statusEl) statusEl.textContent = '掃描中，將 QRCode 對準畫面即可'; })
    .catch(()=>{ if(statusEl) statusEl.textContent = '無法開啟相機，請確認已允許相機權限，或改用手寫簽到'; });
}
function stopQRScanner(){
  if(qrScannerInstance){ try{ qrScannerInstance.stop(); qrScannerInstance.destroy(); }catch(e){} qrScannerInstance = null; }
}
function handleQRDecoded(text){
  const now = Date.now();
  if(now - lastQRScan < 2000) return;
  lastQRScan = now;
  const statusEl = document.getElementById('qr-scan-status');
  const s = findStudentByQRText(text);
  if(!s){ if(statusEl) statusEl.textContent = '無法辨識，請確認是本系統產生的學生 QRCode'; return; }
  const sc = todaysScheduleItems().find(x=>x.studentId===s.id && x.status!=='completed');
  stopQRScanner();
  if(!sc){ openWalkInCheckinModal(s); return; }
  openQRCheckinConfirmModal(sc);
}

async function exportCheckinsExcelWithSignatures(){
  const start = document.getElementById('checkin-hist-start').value; const end = document.getElementById('checkin-hist-end').value;
  if(typeof ExcelJS === 'undefined'){ toast('Excel 元件載入失敗，請檢查網路連線後再試一次'); return; }
  const rows = state.checkins.filter(c=>{ const d=localDateStr(c.timestamp); return d>=start && d<=end; }).sort((a,b)=>a.timestamp.localeCompare(b.timestamp));
  if(rows.length===0){ toast('此區間沒有簽到紀錄可匯出'); return; }
  toast('產生中，請稍候...');
  // 簽名圖存在獨立文件，匯出前先全部讀回來
  for(let i=0;i<rows.length;i+=10){
    await Promise.all(rows.slice(i,i+10).map(c=> (c.hasSig && !getSigSync(c)) ? loadSignature(c.id) : null));
  }
  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet('簽到紀錄');
  ws.columns = [
    { header:'日期時間', key:'time', width:20 },
    { header:'學生姓名', key:'name', width: Math.min(40, Math.max(14, ...rows.map(c=>{ const s=findStudent(c.studentId); const n=s?s.name:''; let w=0; for(const ch of n) w += /[⺀-￿]/.test(ch)?2:1; return w+3; }))) },
    { header:'教練', key:'coach', width:12 },
    { header:'單堂價格', key:'unit', width:12 },
    { header:'抽成金額', key:'commission', width:12 },
    { header:'簽名', key:'sig', width:18 },
  ];
  rows.forEach(c=>{
    const s = findStudent(c.studentId); const co = findCoach(c.coachId);
    const row = ws.addRow({ time: fmtDateTime(c.timestamp), name: s?s.name:'', coach: co?co.name:'', unit: Math.round(c.unitPrice), commission: Math.round(c.commissionAmount), sig: getSigSync(c)?'':(c.backfill?'補簽到':'📷 QR 簽到') });
    row.height = 46;
    row.alignment = { vertical: 'middle' };
    if(getSigSync(c)){
      try{
        const imgId = wb.addImage({ base64: getSigSync(c), extension: 'jpeg' });
        ws.addImage(imgId, { tl: { col: 5.05, row: row.number - 1 + 0.15 }, ext: { width: 100, height: 42 } });
      }catch(e){}
    }
  });
  const buffer = await wb.xlsx.writeBuffer();
  const blob = new Blob([buffer], { type: 'application/octet-stream' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `簽到紀錄含簽名_${start}_${end}.xlsx`; a.click();
  toast('已匯出含簽名圖片的 Excel');
}

function setupSignaturePad(canvas){
  canvas.width = 400; canvas.height = 180;
  const ctx = canvas.getContext('2d');
  function paintWhiteBg(){ ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0,0,canvas.width,canvas.height); }
  paintWhiteBg();
  ctx.lineWidth = 2.5; ctx.lineCap = 'round'; ctx.strokeStyle = '#1A1A1A';
  let drawing = false, last = null, signed = false;
  function pos(e){
    const r = canvas.getBoundingClientRect();
    const p = e.touches && e.touches.length ? e.touches[0] : e;
    return { x: (p.clientX - r.left) * (canvas.width / r.width), y: (p.clientY - r.top) * (canvas.height / r.height) };
  }
  function start(e){ drawing = true; last = pos(e); e.preventDefault(); }
  function move(e){ if(!drawing) return; const p = pos(e); ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last = p; signed = true; e.preventDefault(); }
  function end(){ drawing = false; }
  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, {passive:false});
  canvas.addEventListener('touchmove', move, {passive:false});
  canvas.addEventListener('touchend', end);
  return { clear(){ paintWhiteBg(); signed = false; }, hasSigned(){ return signed; } };
}

let calView = (()=>{ try{ const v=localStorage.getItem('pupie_cal_view'); if(v==='day'||v==='week'||v==='month') return v; }catch(e){} return 'week'; })();
let calCursor = new Date();
const CAL_WEEKDAYS = ['一','二','三','四','五','六','日'];
function weekDatesOf(anchor){
  const monday = new Date(anchor.getFullYear(), anchor.getMonth(), anchor.getDate() - ((anchor.getDay()+6)%7));
  const dates = [];
  for(let i=0;i<7;i++){ dates.push(new Date(monday.getFullYear(), monday.getMonth(), monday.getDate()+i)); }
  return dates;
}
function lessonsOn(dateStr){
  return state.schedules
    .filter(sc=>localDateStr(sc.datetime)===dateStr && sc.status!=='leave' && sc.status!=='cancelled')

function calDayListHtml(dateStr){

function renderWeekView(){
  const container = document.getElementById('week-view-grid');
  if(!container) return;
  const todayStr = localDateStr(new Date());
  const curStr = localDateStr(calCursor);
  const label = document.getElementById('week-view-label');
  document.querySelectorAll('#cal-switch button').forEach(b=>b.classList.toggle('active', b.dataset.v===calView));
  let html = '';
  container.className = 'cal-wrap';
  if(calView==='day'){
    if(label) label.textContent = `${calCursor.getFullYear()}/${calCursor.getMonth()+1}/${calCursor.getDate()}（${CAL_WEEKDAYS[(calCursor.getDay()+6)%7]}）${curStr===todayStr?' 今天':''}`;
    html = calDayListHtml(curStr);
  } else if(calView==='week'){
    const dates = weekDatesOf(calCursor);
    container.className = 'cal-wrap is-week';
    if(label) label.textContent = `${dates[0].getFullYear()}/${dates[0].getMonth()+1}/${dates[0].getDate()} - ${dates[6].getMonth()+1}/${dates[6].getDate()}`;
    html = dates.map((d, idx)=>{
      const dateStr = localDateStr(d);
      const dayItems = lessonsOn(dateStr);
      return `<div class="week-day-col ${dateStr===todayStr?'is-today':''}">
        <div class="week-day-head">${d.getMonth()+1}/${d.getDate()}（${CAL_WEEKDAYS[idx]}）</div>
        ${dayItems.length===0 ? '<div class="hint" style="text-align:center;">—</div>' : dayItems.map(sc=>calItemHtml(sc,false)).join('')}
        <button class="week-add-btn" data-add-date="${dateStr}">＋ 補排課</button>
      </div>`;
    }).join('');
  } else {
    const y = calCursor.getFullYear(), m = calCursor.getMonth();
    if(label) label.textContent = `${y}年${m+1}月`;
    const startOffset = (new Date(y,m,1).getDay()+6)%7;
    const daysInMonth = new Date(y,m+1,0).getDate();
    const rows = Math.ceil((startOffset+daysInMonth)/7);
    const now = new Date();
    let cells = CAL_WEEKDAYS.map(n=>`<div class="cal-dow">${n}</div>`).join('');
    for(let i=0;i<rows*7;i++){
      const d = new Date(y, m, 1-startOffset+i);
      const ds = localDateStr(d);
      const items = lessonsOn(ds);
      const warn = items.some(sc=>sc.status!=='completed' && new Date(sc.datetime)<now);
      const allDone = items.length>0 && items.every(sc=>sc.status==='completed');
      cells += `<button class="cal-cell ${d.getMonth()!==m?'is-other':''} ${ds===todayStr?'is-today':''} ${ds===curStr?'is-selected':''}" data-cal-date="${ds}">
        <span class="cal-num">${d.getDate()}</span>
        ${items.length?`<span class="cal-count ${allDone?'all-done':''}">${items.length}堂</span>`:''}
        ${warn?'<span class="cal-warn">●</span>':''}
      </button>`;
    }
    html = `<div class="cal-month">${cells}</div>
      <div class="hint" style="margin-top:8px;"><span style="color:var(--amber);">●</span> 代表當天有已過時間、還沒簽到的課</div>
      <div class="cal-day-head">${calCursor.getMonth()+1}/${calCursor.getDate()}（${CAL_WEEKDAYS[(calCursor.getDay()+6)%7]}）${curStr===todayStr?' 今天':''}</div>
      ${calDayListHtml(curStr)}`;
  }
  container.innerHTML = html;
  container.querySelectorAll('.week-item[data-sc-id]').forEach(el=>el.addEventListener('click', ()=>openWeekItemActionModal(el.dataset.scId)));
  container.querySelectorAll('.week-add-btn').forEach(el=>el.addEventListener('click', ()=>openAddScheduleModal(null, el.dataset.addDate)));
  container.querySelectorAll('.cal-cell').forEach(el=>el.addEventListener('click', ()=>{
    const [yy,mm,dd] = el.dataset.calDate.split('-').map(Number);
    calCursor = new Date(yy, mm-1, dd);
    renderWeekView();
  }));
}

function bindStudentPicker(id, onChange){

/* 重複排課：從第一堂的日期開始，每週選定的星期幾、同一個時間 */
function buildRepeatDates(startLocal, weekdays, mode, weeks, studentId){
  const out = { dates: [], skipped: 0, target: 0, note: '' };
  if(!startLocal || weekdays.length===0) return out;
  const start = new Date(startLocal);
  if(isNaN(start)) return out;
  let target;
  if(mode==='remaining'){
    const rem = studentId ? studentStats(studentId).remaining : 0;
    const already = studentId ? pendingScheduledCount(studentId) : 0;
    target = Math.max(0, rem - already);
    if(already > 0) out.note = `（剩餘 ${rem} 堂，其中 ${already} 堂已經排好課）`;
  } else {
    target = Infinity;
  }
  const endLimit = mode==='weeks' ? new Date(start.getFullYear(), start.getMonth(), start.getDate() + Math.max(1, weeks)*7) : null;
  const existing = new Set(state.schedules.filter(sc=>sc.studentId===studentId && sc.status!=='cancelled').map(sc=>new Date(sc.datetime).getTime()));
  for(let i=0; i<400 && out.dates.length < Math.min(target, 60); i++){
    const d = new Date(start.getFullYear(), start.getMonth(), start.getDate()+i, start.getHours(), start.getMinutes());
    if(endLimit && d >= endLimit) break;
    if(weekdays.indexOf(d.getDay())<0) continue;
    if(existing.has(d.getTime())){ out.skipped++; continue; }
    out.dates.push(d);
  }
  out.target = target;
  return out;
}

async function finalizeScheduleCheckin(sc, signature, allocated, coachId, opts){
  opts = opts || {};
  if(state.checkins.some(c=>c.scheduleId===sc.id)){ toast('這堂課已經簽到過了'); return; }
  // 過去的課（忘記簽到）：簽到時間記為上課時間，月報表／薪資才會算在正確日期
  const prevSc = { status: sc.status, coachId: sc.coachId || null, autoCreated: !!opts.autoCreated };
  const isPastLesson = localDateStr(sc.datetime) < localDateStr(new Date());
  const ts = isPastLesson ? sc.datetime : new Date().toISOString();
  const unitPrice = allocated ? Number(allocated.unitPrice) : (()=>{ const last = state.purchases.filter(p=>p.studentId===sc.studentId).sort((a,b)=>b.purchaseDate.localeCompare(a.purchaseDate))[0]; return last?Number(last.unitPrice):0; })();
  const rate = getCommissionRate(allocated, coachId);
  const commissionAmount = unitPrice * rate / 100;
  const newCk = { id: genId(), studentId: sc.studentId, purchaseId: allocated?allocated.id:null, coachId: coachId||null, unitPrice, commissionRate: rate, commissionAmount, timestamp: ts, signature, scheduleId: sc.id, backfill: !!(opts.backfill || isPastLesson) };
  state.checkins.push(newCk);
  sc.status = 'completed';
  if(coachId) sc.coachId = coachId;
  Promise.all([saveCheckins(), saveSchedules()]);
  pushPublicView(sc.studentId);
  const stu = findStudent(sc.studentId);
  toastAction('已簽到：'+(stu?stu.name:'')+'（剩 '+studentStats(sc.studentId).remaining+' 堂）', '復原', ()=>undoCheckin(newCk.id, sc.id, prevSc));
  renderView();
}
/* 簽錯人時復原：刪掉這筆簽到、課表回到原本狀態 */
function undoCheckin(checkinId, scheduleId, prev){
  const c = state.checkins.find(x=>x.id===checkinId);
  if(!c){ toast('這筆簽到已經不在了'); return; }
  state.checkins = state.checkins.filter(x=>x.id!==checkinId);
  const sc = state.schedules.find(x=>x.id===scheduleId);
  if(sc && prev && prev.autoCreated) state.schedules = state.schedules.filter(x=>x.id!==scheduleId);   // 掃 QR 自動補的課，復原時一起拿掉
  else if(sc){ sc.status = (prev && prev.status) || 'scheduled'; sc.coachId = (prev && prev.coachId) || null; }
  delete sigCache[checkinId]; delete sigSaved[checkinId];
  if(fbReady && fbUser){ try{ sigDocRef(checkinId).delete().catch(()=>{}); }catch(e){} }
  Promise.all([saveCheckins(), saveSchedules()]);
  pushPublicView(c.studentId);
  renderView();
  toast(prev && prev.autoCreated ? '已復原，這次簽到和自動補的課都取消了' : '已復原，這堂課回到「未簽到」');
}

function deleteCheckin(checkinId, scMode){
  const idx = state.checkins.findIndex(x=>x.id===checkinId);
  if(idx<0){ toast('找不到這筆簽到'); return; }
  const c = state.checkins[idx];
  const sc = c.scheduleId ? state.schedules.find(x=>x.id===c.scheduleId) : null;
  const scBackup = sc ? JSON.parse(JSON.stringify(sc)) : null;
  const sigKeep = sigCache[checkinId];
  state.checkins.splice(idx, 1);
  if(sc && scMode==='delete') state.schedules = state.schedules.filter(x=>x.id!==sc.id);
  else if(sc && scMode==='revert'){ sc.status = 'scheduled'; }

  setTimeout(()=>{ if(undone) return; delete sigCache[checkinId]; delete sigSaved[checkinId]; if(fbReady && fbUser){ try{ sigDocRef(checkinId).delete().catch(()=>{}); }catch(e){} } }, 9000);
  toastAction('已刪除 '+(s?s.name:'')+' '+fmtDateTime(c.timestamp)+' 的簽到（剩 '+studentStats(c.studentId).remaining+' 堂）', '復原', ()=>{
    undone = true;
    if(state.checkins.some(x=>x.id===c.id)) return;
    state.checkins.push(c);
    if(sigKeep) sigCache[c.id] = sigKeep;
    if(scBackup){
      const cur = state.schedules.find(x=>x.id===scBackup.id);
      if(cur) Object.assign(cur, scBackup); else state.schedules.push(scBackup);
    }

    renderView();

}

function exportICS(){
  const now = new Date();
  const upcoming = state.schedules.filter(s=>s.status==='scheduled' && new Date(s.datetime)>=now);
  if(upcoming.length===0){ toast('目前沒有即將到來的排課可匯出'); return; }
  const pad = n => String(n).padStart(2,'0');
  const toICSDate = (iso) => { const d = new Date(iso); return d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate())+'T'+pad(d.getUTCHours())+pad(d.getUTCMinutes())+'00Z'; };

  upcoming.forEach(sc=>{
    const s = findStudent(sc.studentId);
    const start = new Date(sc.datetime);
    const end = new Date(start.getTime() + (Number(sc.durationMinutes)||60)*60000);
    ics += 'BEGIN:VEVENT\r\nUID:'+sc.id+'@coachops\r\nDTSTAMP:'+toICSDate(new Date().toISOString())+'\r\nDTSTART:'+toICSDate(start.toISOString())+'\r\nDTEND:'+toICSDate(end.toISOString())+'\r\nSUMMARY:訓練課程 - '+(branchLabel(s)?('['+branchLabel(s)+'] '):'')+(s?s.name:'')+'\r\nDESCRIPTION:'+(sc.note||'').replace(/\n/g,' ')+'\r\nEND:VEVENT\r\n';
  });
  ics += 'END:VCALENDAR\r\n';
  const blob = new Blob([ics], {type:'text/calendar;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'coachops-schedule.ics'; a.click();

}

async function exportFullBackup(){

  const fullCheckins = state.checkins.map(c=>{ const s = getSigSync(c); if(!s) return c; const o = Object.assign({}, c, { signature: s }); delete o.hasSig; return o; });
  const backup = {
    version: 2,
    exportedAt: new Date().toISOString(),
    students: state.students,

    packageTemplates: state.packageTemplates || [],
    settings: state.settings
  };
  const blob = new Blob([JSON.stringify(backup, null, 2)], {type:'application/json'});
  const a = document.createElement('a');

async function handleImportBackupFile(e){
  const file = e.target.files[0];
  if(!file) return;
  if(!confirm('匯入備份會覆蓋目前所有資料（學生、購課、簽到、課表、設定），確定要繼續嗎？建議先匯出目前資料做備份再匯入。')){ e.target.value=''; return; }
  try{

    if(!data || !Array.isArray(data.students)){ toast('檔案格式不正確，請確認是本系統匯出的備份檔'); e.target.value=''; return; }
    state.students = data.students || [];
    state.coaches = data.coaches || [];
    state.purchases = data.purchases || [];
    state.checkins = data.checkins || [];
    state.schedules = data.schedules || [];
    state.packageTemplates = data.packageTemplates || state.packageTemplates || [];
    state.settings = data.settings || state.settings;
    toast('正在寫入備份資料，請稍候...');

function downloadCSV(filename, rows){
  const csv = rows.map(r=>r.map(v=>{ const s = String(v==null?'':v); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }).join(',')).join('\r\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; a.click();
}

/* Excel 工作表：依內容自動設定欄寬（中文算兩格），打開就能看到完整內容 */
function sheetFromRows(rows){
  const ws = XLSX.utils.json_to_sheet(rows);
  const keys = rows.length ? Object.keys(rows[0]) : [];
  const w = s => { let n = 0; for(const ch of String(s==null?'':s)) n += /[\u1100-\uFFFF]/.test(ch) ? 2 : 1; return n; };
  ws['!cols'] = keys.map(k=>({ wch: Math.min(50, Math.max(6, w(k), ...rows.map(r=>w(r[k])))) + 2 }));
  return ws;
}

function buildReport2Rows(start, end){
  const rows = [];
  state.checkins.filter(c=>{ const d=localDateStr(c.timestamp); return d>=start && d<=end; }).forEach(c=>{
    const s = findStudent(c.studentId); const co = findCoach(c.coachId); const p = findPurchase(c.purchaseId);
    rows.push({ time: c.timestamp, '簽到日期時間': fmtDateTime(c.timestamp), '學生姓名': s?s.name:'', '授課教練': co?co.name:'未指定', '課程方案': p?p.packageName:'', '單堂金額': Math.round(c.unitPrice), '簽到狀態': '已簽到' });
  });
  state.schedules.filter(sc=>(sc.status==='leave'||sc.status==='cancelled') && localDateStr(sc.datetime)>=start && localDateStr(sc.datetime)<=end).forEach(sc=>{
    const s = findStudent(sc.studentId); const co = findCoach(sc.coachId);
    rows.push({ time: sc.datetime, '簽到日期時間': fmtDateTime(sc.datetime), '學生姓名': s?s.name:'', '授課教練': co?co.name:'', '課程方案': '', '單堂金額': '', '簽到狀態': sc.status==='leave'?'請假':'取消' });
  });
  rows.sort((a,b)=>a.time.localeCompare(b.time));
  rows.forEach(r=>delete r.time);
  return rows;
}

/* 購課表單的額外欄位：課程類型、舊資料（不計入銷售額、之前已上堂數、是否已升級過） */
function purchaseExtraFieldsHtml(p){
  const ct = p ? courseTypeOf(p) : '一對一';
  const legacy = !!(p && p.legacy);
  /* 編輯時：原本就有設定類型、或方案名稱判斷得出來，才算「已確定」，打字改名稱時不會被自動改掉 */
  const fixed = p && (p.courseType==='一對一' || p.courseType==='一對二');
  return `
    <div class="field"><label>課程類型（依方案名稱自動判斷，例如 1v1、1v2，錯了可以手動改）</label><select id="f-ctype" data-manual="${fixed?'1':''}">
      <option value="一對一" ${ct==='一對一'?'selected':''}>一對一</option>
      <option value="一對二" ${ct==='一對二'?'selected':''}>一對二</option>
    </select></div>
    <div id="f-up-hint" class="hint" style="margin:-4px 0 12px;"></div>
    <div class="field"><label style="display:flex;align-items:center;gap:8px;cursor:pointer;"><input type="checkbox" id="f-legacy" style="width:auto;" ${legacy?'checked':''}> 舊資料（舊合約帶入：不計入銷售額，可填「之前已上堂數」）</label></div>
    <div id="f-legacy-box" style="display:${legacy?'block':'none'};">
      <div class="field-row">
        <div class="field"><label>之前已上堂數（不產生簽到、不影響薪資）</label><input type="number" id="f-usedbefore" min="0" value="${p && p.usedBefore ? p.usedBefore : 0}"></div>
        <div class="field"><label>這份合約是否已升級過</label><select id="f-upgradeused"><option value="">否</option><option value="1" ${p && p.upgradeUsed ? 'selected':''}>是</option></select></div>
      </div>
    </div>`;
}
function bindPurchaseExtraFields(p){
  const cb = document.getElementById('f-legacy'); const box = document.getElementById('f-legacy-box');
  if(cb && box) cb.addEventListener('change', ()=>{ box.style.display = cb.checked ? 'block' : 'none'; updateUpgradeHint(p); });
  const ctSel = document.getElementById('f-ctype');
  const pkg = document.getElementById('f-pkg');
  const ses = document.getElementById('f-sessions');
  const up = document.getElementById('f-upgradeused');
  if(ctSel) ctSel.addEventListener('change', ()=>{ ctSel.dataset.manual = '1'; updateUpgradeHint(p); });
  if(pkg) pkg.addEventListener('input', ()=>{
    if(ctSel && !ctSel.dataset.manual){ const d = detectCourseType(pkg.value); if(d) ctSel.value = d; }
    updateUpgradeHint(p);
  });
  if(ses) ses.addEventListener('input', ()=>updateUpgradeHint(p));
  if(up) up.addEventListener('change', ()=>updateUpgradeHint(p));
  updateUpgradeHint(p);
}
/* 購課視窗下方的提示：這份合約之後能不能升級 */
function updateUpgradeHint(p){
  const box = document.getElementById('f-up-hint'); if(!box) return;
  const ctSel = document.getElementById('f-ctype'); const ses = document.getElementById('f-sessions');
  const ct = ctSel ? ctSel.value : '一對一';
  if(p && p.upgrade){ box.innerHTML = '已升級過（每份合約只能升級一次）'; box.style.color = 'var(--steel)'; return; }
  const legacy = document.getElementById('f-legacy'); const up = document.getElementById('f-upgradeused');
  if(legacy && legacy.checked && up && up.value==='1'){ box.innerHTML = '已勾選「已升級過」，不會出現升級按鈕'; box.style.color = 'var(--steel)'; return; }
  const n = Number(ses ? ses.value : 0);
  const opts = (UPGRADE_TABLE[ct]||[]).filter(o=>o.from===n);
  if(opts.length){
    box.innerHTML = '✅ 這份合約之後可以升級：' + opts.map(o=>o.from+'→'+o.to+' 堂（補 '+fmtMoney(o.fee)+'）').join('、');
    box.style.color = 'var(--green)';
  } else {
    box.innerHTML = n>0 ? ('這個堂數沒有標準升級方案（'+ct+(ct==='一對一'?'：6 或 12 堂才能升級':'：6 堂才能升級')+'）') : '';
    box.style.color = 'var(--steel)';
  }
}
function readPurchaseExtras(sessions, price, existing){
  const legacy = !!document.getElementById('f-legacy').checked;
  const usedBefore = legacy ? (Number(document.getElementById('f-usedbefore').value)||0) : 0;
  if(usedBefore < 0 || usedBefore > sessions){ toast('「之前已上堂數」不能大於總堂數'); return null; }
  const sysUpgraded = !!(existing && existing.upgrade);
  return {
    courseType: document.getElementById('f-ctype').value || '一對一',
    legacy,
    usedBefore,
    usedBeforeUnit: sysUpgraded ? (existing.usedBeforeUnit!=null ? existing.usedBeforeUnit : 0) : (price/sessions),
    upgradeUsed: sysUpgraded ? true : (legacy ? document.getElementById('f-upgradeused').value==='1' : false)
  };
}

    p.paymentStatus = document.getElementById('f-paystatus').value;
    p.paymentMethod = document.getElementById('f-paymethod').value;

/* 學生詳細頁的「升級」大按鈕：只有一份可升級就直接開，有好幾份先選 */
function openUpgradePicker(studentId){
  const ups = state.purchases.filter(p=>p.studentId===studentId && canUpgrade(p)).sort((a,b)=>b.purchaseDate.localeCompare(a.purchaseDate));
  if(ups.length===0){ toast('目前沒有可升級的合約'); return; }
  if(ups.length===1){ openUpgradeModal(ups[0].id); return; }
  openModal(`
    <h3>要升級哪一份合約？</h3>
    <div style="display:flex;flex-direction:column;gap:8px;">${ups.map(p=>`<button class="btn btn-outline up-pick" data-id="${p.id}" style="justify-content:flex-start;text-align:left;">${esc(p.packageName)} · ${p.sessions} 堂 · 剩 ${packageRemaining(p)} 堂</button>`).join('')}</div>
    <div class="modal-actions"><button class="btn btn-outline" id="modal-cancel">取消</button></div>
  `);
  document.getElementById('modal-cancel').addEventListener('click', closeModal);
  document.querySelectorAll('.up-pick').forEach(b=>b.addEventListener('click', ()=>{ closeModal(); openUpgradeModal(b.dataset.id); }));
}
function openUpgradeModal(purchaseId){
  const p = findPurchase(purchaseId);
  if(!p) return;
  if(p.upgradeUsed){ toast('這份合約已經升級過了，每份合約只能升級一次'); return; }
  const opts = upgradeOptionsFor(p);
  const optHtml = opts.map((o,i)=>`<option value="${i}">${o.from} → ${o.to} 堂（補差額 ${fmtMoney(o.fee)}）</option>`).join('') + `<option value="custom">自訂（手動輸入堂數與金額）</option>`;
  const s = findStudent(p.studentId);
  openModal(`
    <h3>升級合約</h3>
    <div class="hint" style="margin-bottom:12px;">${esc(s?s.name:'')} · ${esc(p.packageName)}（${esc(courseTypeOf(p))}） · 目前 ${p.sessions} 堂 / ${fmtMoney(p.price)}，已上 ${packageUsed(p.id)} 堂，剩 ${packageRemaining(p)} 堂</div>
    ${opts.length===0 ? `<div class="hint" style="margin-bottom:12px;color:var(--amber);">這份合約沒有對應的標準升級選項（${courseTypeOf(p)==='一對二'?'一對二需要是 6 堂':'一對一需要是 6 或 12 堂'}），請手動輸入堂數與補差額。</div>` : ''}
    <div class="field"><label>升級方案</label><select id="f-up-opt">${optHtml}</select></div>
    <div class="field-row">
      <div class="field"><label>多出堂數</label><input type="number" id="f-up-extra" min="1"></div>
      <div class="field"><label>補差額（元，可手動修改）</label><input type="number" id="f-up-fee" min="0"></div>
    </div>
    <div class="field"><label>升級日期</label><input type="date" id="f-up-date" value="${todayISO()}"></div>
    <div id="up-preview" class="hint" style="margin:8px 0 14px;line-height:1.7;"></div>
    <div class="modal-actions">
      <button class="btn btn-outline" id="modal-cancel">取消</button>
      <button class="btn btn-primary" id="modal-save">確認升級</button>
    </div>
  `);
  const optEl = document.getElementById('f-up-opt'), extraEl = document.getElementById('f-up-extra'), feeEl = document.getElementById('f-up-fee'), pv = document.getElementById('up-preview');
  function fillFromOpt(){
    if(optEl.value==='custom'){ return; }
    const o = opts[Number(optEl.value)];
    extraEl.value = o.to - o.from; feeEl.value = o.fee;
  }
  function preview(){
    const extra = Number(extraEl.value)||0, fee = Number(feeEl.value)||0;
    if(extra<=0){ pv.textContent = '請輸入多出堂數'; return; }
    const newSessions = Number(p.sessions) + extra, newPrice = Number(p.price) + fee;
    const used = packageUsed(p.id), rem = newSessions - used, rec = recognizedValue(p);
    const unit = rem>0 ? (newPrice - rec)/rem : 0;
    pv.innerHTML = `升級後合約：<strong>${newSessions} 堂 / ${fmtMoney(newPrice)}</strong><br>已上 ${used} 堂（已上的單價不變），剩餘 <strong>${rem} 堂</strong><br>剩餘堂數的每堂單價：<strong>${fmtMoney(Math.round(unit))}</strong>${unit<0?'<br><span style="color:var(--red);">⚠ 單價為負數，請檢查金額</span>':''}`;
  }
  optEl.addEventListener('change', ()=>{ fillFromOpt(); preview(); });
  extraEl.addEventListener('input', preview); feeEl.addEventListener('input', preview);
  if(opts.length>0){ optEl.value = '0'; fillFromOpt(); } else { optEl.value = 'custom'; }
  preview();
  document.getElementById('modal-cancel').addEventListener('click', closeModal);
  document.getElementById('modal-save').addEventListener('click', ()=>{
    const extra = Math.round(Number(extraEl.value)||0), fee = Number(feeEl.value);
    if(!(extra>0)){ toast('請輸入多出堂數'); return; }
    if(isNaN(fee) || fee<0){ toast('請輸入正確的補差額'); return; }
    const upDate = document.getElementById('f-up-date').value || todayISO();
    if(p.usedBefore>0 && (p.usedBeforeUnit==null || p.usedBeforeUnit==='')) p.usedBeforeUnit = p.unitPrice;
    p.upgrade = { date: upDate, fromSessions: Number(p.sessions), toSessions: Number(p.sessions)+extra, extra, fee, fromPrice: Number(p.price) };
    p.upgradeUsed = true; p.upgradeFee = fee; p.upgradeDate = upDate;
    p.sessions = Number(p.sessions) + extra;
    p.price = Number(p.price) + fee;
    refreshPurchaseUnitPrice(p);
    const fixedOrphans = reconcileOrphanCheckins(p.studentId);
    savePurchases(); if(fixedOrphans>0) saveCheckins();
    pushPublicView(p.studentId);
    closeModal(); renderView();
    toast('已升級為 '+p.sessions+' 堂，補差額 '+fmtMoney(fee));
  });
}
function undoUpgrade(purchaseId){
  const p = findPurchase(purchaseId);
  if(!p || !p.upgrade) return;
  const u = p.upgrade;
  if(packageUsed(p.id) > u.fromSessions){ toast('升級後已經上了超過原本堂數的課，無法撤銷'); return; }
  if(!confirm('確定要撤銷這次升級嗎？\n合約會回到 '+u.fromSessions+' 堂 / '+fmtMoney(u.fromPrice)+'，補差額 '+fmtMoney(u.fee)+' 的紀錄也會移除。')) return;
  p.sessions = u.fromSessions; p.price = u.fromPrice;
  delete p.upgrade; delete p.upgradeFee; delete p.upgradeDate;
  p.upgradeUsed = false;
  refreshPurchaseUnitPrice(p);
  savePurchases();
  pushPublicView(p.studentId);
  closeModal(); renderView();
  toast('已撤銷升級');
}

const PRICE_TEMPLATES = [
  {name:'一對一 體驗課程',sessions:1,price:1000},{name:'一對一 6 堂',sessions:6,price:9000},{name:'一對一 12 堂',sessions:12,price:17400},{name:'一對一 18 堂',sessions:18,price:25200},
  {name:'一對二 體驗課程',sessions:1,price:1500},{name:'一對二 6 堂',sessions:6,price:13200},{name:'一對二 12 堂',sessions:12,price:24000}
];
function legacyCell(row, prefix){
  const k = Object.keys(row).find(x=>String(x).replace(/\s/g,'').startsWith(prefix));
  return k===undefined ? '' : String(row[k]==null?'':row[k]).trim();
}
function legacyNum(s){ if(s==='') return NaN; return Number(String(s).replace(/[,\s元]/g,'')); }
function legacyDate(s){
  if(!s) return { ok:true, v:'' };
  let m = String(s).match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
  if(m) return { ok:true, v: m[1]+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[3]).padStart(2,'0') };
  return { ok:false, v:'' };
}
function parseLegacyRows(rows){
  const out = [];
  rows.forEach((row, idx)=>{
    const line = row.__line || (idx + 2);
    const name = legacyCell(row,'姓名');
    const note = legacyCell(row,'備註');
    if(!name) return;
    if(note.includes('（範例）')) return;
    const errors = [];
    const typeRaw = legacyCell(row,'課程類型');
    const type = (typeRaw==='一對一' || typeRaw==='一對二') ? typeRaw : detectCourseType(typeRaw);
    if(!type) errors.push('課程類型要填「一對一」或「一對二」（也可以寫 1v1、1v2）');
    const branchRaw = legacyCell(row,'店別');
    const branch = branchRaw==='1店' ? '1' : branchRaw==='2店' ? '2' : '';
    if(!branch) errors.push('店別要選「1店」或「2店」');
    const coachName = legacyCell(row,'授課教練');
    let coachId = null;
    if(coachName){
      const co = state.coaches.find(c=>c.name===coachName);
      if(co) coachId = co.id; else errors.push('找不到教練「'+coachName+'」（請先到設定新增，或改成現有教練姓名）');
    }
    const sessions = legacyNum(legacyCell(row,'原合約堂數'));
    const price = legacyNum(legacyCell(row,'原合約金額'));
    const remaining = legacyNum(legacyCell(row,'剩下堂數'));
    if(!(sessions>0) || !Number.isInteger(sessions)) errors.push('原合約堂數要是大於 0 的整數');
    if(isNaN(price) || price<0) errors.push('原合約金額要是 0 以上的數字');
    if(isNaN(remaining) || !Number.isInteger(remaining) || remaining<0) errors.push('剩下堂數要是 0 以上的整數');
    else if(sessions>0 && remaining>sessions) errors.push('剩下堂數不能大於原合約堂數');
    const upRaw = legacyCell(row,'是否已升級過');
    if(upRaw!=='是' && upRaw!=='否') errors.push('「是否已升級過」要選「是」或「否」');
    const cs = legacyDate(legacyCell(row,'合約起日')), ce = legacyDate(legacyCell(row,'合約迄日'));
    if(!cs.ok) errors.push('合約起日格式不對（請用 2026-10-20）');
    if(!ce.ok) errors.push('合約迄日格式不對（請用 2026-10-20）');
    out.push({ line, name, type, branch, coachName, coachId, sessions, price, remaining, upgraded: upRaw==='是', contractStart: cs.v, contractEnd: ce.v, note, errors });
  });
  return out;
}
function legacyShowError(msg){
  openModal(`<h3>匯入舊學員資料</h3><p style="font-size:14px;color:var(--red);line-height:1.7;">${esc(msg)}</p><div class="modal-actions"><button class="btn btn-primary" id="modal-cancel">我知道了</button></div>`);
  document.getElementById('modal-cancel').addEventListener('click', closeModal);
}
function parseCsvText(text){
  const rows = []; let row = [], cur = '', inQ = false;
  for(let i=0;i<text.length;i++){
    const ch = text[i];
    if(inQ){
      if(ch==='"'){ if(text[i+1]==='"'){ cur+='"'; i++; } else inQ=false; } else cur+=ch;
    } else if(ch==='"') inQ = true;
    else if(ch===','){ row.push(cur); cur=''; }
    else if(ch==='\n' || ch==='\r'){ if(ch==='\r' && text[i+1]==='\n') i++; row.push(cur); cur=''; rows.push(row); row=[]; }
    else cur+=ch;
  }
  if(cur!=='' || row.length){ row.push(cur); rows.push(row); }
  return rows;
}
function ensureXLSX(){
  if(typeof XLSX!=='undefined') return Promise.resolve(true);
  const urls = ['https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js','https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js','https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'];
  return urls.reduce((chain, url)=>chain.then(ok=>{
    if(ok || typeof XLSX!=='undefined') return true;
    return new Promise(res=>{
      const s = document.createElement('script'); s.src = url;
      const t = setTimeout(()=>res(false), 10000);
      s.onload = ()=>{ clearTimeout(t); res(typeof XLSX!=='undefined'); };
      s.onerror = ()=>{ clearTimeout(t); res(false); };
      document.head.appendChild(s);
    });
  }), Promise.resolve(false));
}
async function readLegacyExcel(file){
  toast('正在讀取檔案…');
  try{
    let sheets = [];   // 每個分頁都轉成「二維陣列」
    if(/\.csv$/i.test(file.name)){
      const txt = (await file.text()).replace(/^﻿/, '');
      sheets = [ parseCsvText(txt) ];
    } else {
      const ok = await ensureXLSX();
      if(!ok){ legacyShowError('Excel 讀取工具沒有載入成功（可能是網路或瀏覽器擋住了）。\n解決辦法：把 Excel 另存成 CSV（Excel：檔案 → 另存新檔 → CSV UTF-8；Numbers：檔案 → 輸出到 → CSV），再選那個 .csv 檔案。'); return; }
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type:'array' });
      sheets = wb.SheetNames.map(n=>XLSX.utils.sheet_to_json(wb.Sheets[n], { header:1, defval:'', raw:false }));
    }
    /* 自動找出「有姓名、課程類型標題」的分頁和標題列（Numbers 匯出的檔案標題常在第 2 列） */
    const isHeaderRow = (r)=> r.some(c=>String(c).replace(/\s/g,'').startsWith('姓名')) && r.some(c=>String(c).includes('課程類型'));
    let rows = null;
    for(const aoa of sheets){
      const hi = aoa.slice(0,15).findIndex(isHeaderRow);
      if(hi < 0) continue;
      const headers = aoa[hi].map(c=>String(c).trim());
      rows = aoa.slice(hi+1).map((r, i)=>{ const o = { __line: hi + i + 2 }; headers.forEach((hd, ci)=>{ if(hd) o[hd] = r[ci]; }); return o; });
      break;
    }
    if(!rows){ legacyShowError('找不到標題列：檔案裡需要有「姓名」和「課程類型」這兩個欄位標題。請確認選的是「舊學員資料匯入表」。'); return; }
    const parsed = parseLegacyRows(rows);
    if(parsed.length===0){ legacyShowError('沒有讀到任何學員資料。請確認「姓名」欄有填資料（範例列會被略過）。'); return; }
    openLegacyPreviewModal(parsed);
  }catch(err){
    console.error(err);
    legacyShowError('讀取檔案失敗：' + ((err && err.message) ? err.message : String(err)));
  }
}

    <div class="table-wrap" style="max-height:240px;overflow:auto;"><table><thead><tr><th>姓名</th><th>類型</th><th>店</th><th>教練</th><th>堂數</th><th>金額</th><th>剩</th><th>已升級</th><th></th></tr></thead><tbody>${rowsHtml}</tbody></table></div>
