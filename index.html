    </div>
  `);
  document.getElementById('modal-cancel').addEventListener('click', closeModal);
  const clr = document.getElementById('legacy-clear');
  clr.addEventListener('change', ()=>{ document.getElementById('legacy-clear-box').style.display = clr.checked ? 'block' : 'none'; });
  document.getElementById('modal-save').addEventListener('click', async ()=>{
    const clearFirst = clr.checked;
    if(clearFirst && document.getElementById('legacy-clear-text').value.trim()!=='清空'){ toast('要清空的話，請在欄位輸入「清空」'); return; }
    await applyLegacyImport(good, clearFirst);

}
async function applyLegacyImport(good, clearFirst){
  const btn = document.getElementById('modal-save'); if(btn){ btn.disabled = true; btn.textContent = '匯入中…'; }
  try{
    if(clearFirst){
      for(const s of state.students){ await deletePublicView(s.id); }
      if(fbReady && fbUser){ state.checkins.forEach(c=>{ try{ sigDocRef(c.id).delete().catch(()=>{}); }catch(e){} }); }
      state.students = []; state.purchases = []; state.checkins = []; state.schedules = [];
    }
    let newStudents = 0, newPurchases = 0;
    good.forEach(r=>{
      let s = state.students.find(x=>!x.archived && x.name===r.name);
      if(!s){
        s = { id: genId(), name: r.name, branch: r.branch, gender: '', age: null, birthday: '', phone: '', note: '', customQRCode: null, createdAt: new Date().toISOString() };
        state.students.push(s); newStudents++;
      }
      state.purchases.push({
        id: genId(), studentId: s.id, packageName: r.type+' '+r.sessions+' 堂（舊合約）', sessions: r.sessions, price: r.price, unitPrice: r.price/r.sessions,
        coachId: r.coachId, commissionRateOverride: null, paymentStatus: '已付款', paymentMethod: '現金', purchaseDate: todayISO(),
        contractStart: r.contractStart, contractEnd: r.contractEnd, note: r.note || '',
        courseType: r.type, legacy: true, usedBefore: r.sessions - r.remaining, usedBeforeUnit: r.price/r.sessions, upgradeUsed: r.upgraded
      });
      newPurchases++;
    });
    const saves = [saveStudents(), savePurchases()];
    if(clearFirst){ saves.push(saveCheckins(), saveSchedules()); }
    await Promise.all(saves);
    closeModal();
    openStudentId = null;
    switchTab('students');
    toast('已匯入 '+newPurchases+' 份合約（新增 '+newStudents+' 位學員）');
  }catch(err){
    console.error(err);
    toast('匯入失敗，請重新整理後再試（資料可能已部分寫入，請檢查學員清單）');
    if(btn){ btn.disabled = false; btn.textContent = '重試匯入'; }
  }
}

function bindSettingsHandlers(){
  const q = (sel)=>document.querySelector(sel);
  if(q('#btn-save-settings')) q('#btn-save-settings').addEventListener('click', ()=>{
    const defRate = readRateField('f-rate'); if(defRate===null) return;
    if(!fbReady){ const pwdEl=document.getElementById('f-pwd'); if(pwdEl) state.settings.coachPassword = pwdEl.value.trim() || '0000'; }
    state.settings.sessionDurationMinutes = Number(document.getElementById('f-dur').value)||60;
    state.settings.defaultCommissionRate = defRate;
    state.settings.calendarReminders = [30,60].filter(m=>{ const el=document.getElementById('f-rem-'+m); return el && el.checked; });
    saveSettings();
    toast('設定已更新');
  });
  const resetBtn = document.getElementById('btn-reset-pwd');
  if(resetBtn) resetBtn.addEventListener('click', async ()=>{
    try{ await firebase.auth().sendPasswordResetEmail(fbUser.email); toast('重設密碼信已寄出，請check信箱'); }
    catch(e){ toast('寄送失敗：'+(e&&e.message?e.message:'')); }
  });
  const importBtn = document.getElementById('btn-import-legacy');
  if(importBtn) importBtn.addEventListener('click', importLegacyLocalData);
  if(q('#theme-light-btn')) q('#theme-light-btn').addEventListener('click', ()=>{ setTheme('light'); switchTab('settings'); });
  if(q('#theme-gray-btn')) q('#theme-gray-btn').addEventListener('click', ()=>{ setTheme('gray'); switchTab('settings'); });
  if(q('#theme-blue-btn')) q('#theme-blue-btn').addEventListener('click', ()=>{ setTheme('blue'); switchTab('settings'); });
  if(q('#theme-dark-btn')) q('#theme-dark-btn').addEventListener('click', ()=>{ setTheme('dark'); switchTab('settings'); });
  if(q('#theme-navy-btn')) q('#theme-navy-btn').addEventListener('click', ()=>{ setTheme('navy'); switchTab('settings'); });
  const facelockBtn = document.getElementById('btn-facelock-toggle');

        disableFacelock();

  });
  if(q('#btn-add-template')) q('#btn-add-template').addEventListener('click', ()=>{
    const name = document.getElementById('f-tpl-name').value.trim();
    const sessions = Number(document.getElementById('f-tpl-sessions').value);
    const price = Number(document.getElementById('f-tpl-price').value);
    if(!name || !sessions || sessions<=0){ toast('請填寫方案名稱與有效堂數'); return; }
    state.packageTemplates.push({ id: genId(), name, sessions, price: price||0 });
    savePackageTemplates();
    switchTab('settings');
  });
  if(q('#btn-add-price-templates')) q('#btn-add-price-templates').addEventListener('click', ()=>{
    const have = new Set((state.packageTemplates||[]).map(t=>t.name));
    let added = 0;
    PRICE_TEMPLATES.forEach(t=>{ if(!have.has(t.name)){ state.packageTemplates.push({ id: genId(), name: t.name, sessions: t.sessions, price: t.price }); added++; } });
    if(added>0) savePackageTemplates();
    toast(added>0 ? ('已加入 '+added+' 個價目表範本') : '價目表範本都已經在清單裡了');
    switchTab('settings');
  });
  if(q('#btn-import-excel')) q('#btn-import-excel').addEventListener('click', ()=>q('#excel-import-file-input').click());

  document.querySelectorAll('.tpl-del-btn').forEach(b=>b.addEventListener('click', ()=>{
    state.packageTemplates = state.packageTemplates.filter(t=>t.id!==b.dataset.id);
    savePackageTemplates();
    switchTab('settings');
  }));
}

    'auth/weak-password': '密碼強度不足，至少需要 6 碼',
    'auth/user-not-found': '找不到這個帳號，請確認 Email 或改用「註冊新帳號」',
    'auth/wrong-password': '密碼錯誤',
    'auth/too-many-requests': '嘗試次數過多，請稍後再試',
    'auth/invalid-credential': 'Email 或密碼錯誤',
  };
  return map[code] || (e && e.message) || '發生錯誤，請再試一次';
}
async function handleAuthSubmit(){
  const email = document.getElementById('auth-email').value.trim();
  const pw = document.getElementById('auth-password').value;
  const errEl = document.getElementById('auth-error');
  errEl.textContent = '';
  if(!email || !pw){ errEl.textContent = '請輸入 Email 與密碼'; return; }
  if(authMode==='register'){
    const pw2 = document.getElementById('auth-password2').value;
    if(pw !== pw2){ errEl.textContent = '兩次密碼輸入不一致'; return; }
    if(pw.length < 6){ errEl.textContent = '密碼至少需要 6 碼'; return; }
    try{ await firebase.auth().createUserWithEmailAndPassword(email, pw); }
    catch(e){ errEl.textContent = mapAuthError(e); }
  } else {
    try{ await firebase.auth().signInWithEmailAndPassword(email, pw); }
    catch(e){ errEl.textContent = mapAuthError(e); }
  }
}
async function handleForgotPassword(){
  const email = document.getElementById('auth-email').value.trim();
  const errEl = document.getElementById('auth-error');
  if(!email){ errEl.textContent = '請先輸入 Email 再點忘記密碼'; return; }
  try{ await firebase.auth().sendPasswordResetEmail(email); toast('重設密碼信已寄出，請check信箱'); }
  catch(e){ errEl.textContent = mapAuthError(e); }
}
async function importLegacyLocalData(){
  const keys = ['students','coaches','purchases','checkins','schedules','settings'];
  const local = {};
  let found = false;
  keys.forEach(k=>{
    try{ const raw = localStorage.getItem(LS_PREFIX+k); if(raw){ local[k] = JSON.parse(raw); found = true; } }catch(e){}
  });
  if(!found){ toast('這台裝置沒有找到舊的本機資料'); return; }
  if(!confirm('偵測到這台裝置有舊的本機資料，是否要匯入到目前登入的帳號？（會覆蓋目前帳號在雲端的資料）')) return;
  try{
    await Promise.all(keys.map(k => local[k] !== undefined ? fbDocRef(k).set({ value: local[k], updatedAt: Date.now() }) : Promise.resolve()));
    toast('已匯入，正在重新整理...');
    setTimeout(()=>location.reload(), 1000);
  }catch(e){ toast('匯入失敗：'+(e&&e.message?e.message:'')); }
}

/* ---------------- 學生自助查詢連結 ---------------- */
function ensureStudentToken(s){
  if(!s.publicToken){ s.publicToken = genId()+genId()+genId(); }
  return s.publicToken;
}
function buildStudentViewUrl(token){
  return location.origin + location.pathname + '?student=' + token + (usingCustomFbConfig ? ('&cfg=' + b64urlEncodeObj(FIREBASE_CONFIG)) : '');
}
async function pushPublicView(studentId){
  if(!fbReady || !fbUser) return;
  const s = findStudent(studentId);
  if(!s || !s.publicViewEnabled || !s.publicToken) return;
  const st = studentStats(studentId);
  const upcoming = state.schedules
    .filter(sc => sc.studentId===studentId && sc.status==='scheduled' && new Date(sc.datetime) >= new Date())
    .sort((a,b)=> a.datetime.localeCompare(b.datetime))[0];
  const recentCheckins = state.checkins
    .filter(c => c.studentId===studentId)
    .sort((a,b)=> b.timestamp.localeCompare(a.timestamp))
    .slice(0, 10)
    .map(c => c.timestamp);
  const payload = {
    ownerUid: fbUser.uid,
    name: s.name,
    remaining: st.remaining,
    purchased: st.purchased,
    used: st.used,
    nextClass: upcoming ? upcoming.datetime : null,
    recentCheckins,
    updatedAt: Date.now()
  };
  try{ await firebase.firestore().collection('public_student_view').doc(s.publicToken).set(payload); }
  catch(e){ console.warn('公開檢視同步失敗', e); }
}
async function deletePublicView(studentId){
  const s = findStudent(studentId);
  if(!fbReady || !s || !s.publicToken) return;
  try{ await firebase.firestore().collection('public_student_view').doc(s.publicToken).delete(); }catch(e){}
}
function openStudentLinkModal(studentId){
  if(!fbReady){ toast('此功能需要先設定好雲端同步（Firebase）才能使用'); return; }
  const s = findStudent(studentId);
  if(!s) return;
  if(s.publicViewEnabled && s.publicToken){
    const url = buildStudentViewUrl(s.publicToken);
    openModal(`
      <h3>${esc(s.name)} 的自助查詢連結</h3>
      <div class="hint" style="margin-bottom:10px;">學生打開這個連結不用登入，只會看到自己的剩餘堂數、下次上課時間與簽到歷史，看不到其他資料。</div>
      <div class="field"><label>連結網址</label><input type="text" id="student-link-url" value="${esc(url)}" readonly></div>
      <button class="btn btn-outline btn-sm" id="btn-copy-link" style="margin-bottom:14px;">複製連結</button>
      <div style="display:flex;flex-direction:column;align-items:center;gap:10px;">
        <div id="student-link-qr" style="padding:14px;background:#fff;border:1px solid var(--line);border-radius:12px;"></div>
        <div class="hint">或讓學生直接掃這個 QR 開啟連結（跟簽到用的 QR 是不同用途）</div>
      </div>
      <div class="modal-actions" style="justify-content:space-between;">
        <button class="btn btn-danger btn-sm" id="btn-disable-link">停用連結</button>
        <button class="btn btn-outline" id="modal-cancel">關閉</button>
      </div>
    `);
    document.getElementById('modal-cancel').addEventListener('click', closeModal);
    document.getElementById('btn-copy-link').addEventListener('click', ()=>{
      const input = document.getElementById('student-link-url');
      input.select();
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(url).then(()=>toast('已複製連結')).catch(()=>toast('請手動選取複製'));
      } else { toast('請手動選取複製'); }
    });
    if(typeof QRCode !== 'undefined'){
      new QRCode(document.getElementById('student-link-qr'), { text: url, width:180, height:180, colorDark:'#1A1A1A', colorLight:'#ffffff', correctLevel: QRCode.CorrectLevel.H });
    }
    document.getElementById('btn-disable-link').addEventListener('click', async ()=>{
      s.publicViewEnabled = false;
      saveStudents();
      await deletePublicView(studentId);
      closeModal();
      toast('已停用連結');
    });
  } else {
    openModal(`
      <h3>${esc(s.name)} 的自助查詢連結</h3>
      <div class="hint" style="margin-bottom:14px;">產生後，學生可以透過專屬連結查看自己的剩餘堂數、下次上課時間與簽到歷史，不需要登入帳號。</div>
      <div class="modal-actions">
        <button class="btn btn-outline" id="modal-cancel">取消</button>
        <button class="btn btn-primary" id="btn-enable-link">產生連結</button>
      </div>
    `);
    document.getElementById('modal-cancel').addEventListener('click', closeModal);
    document.getElementById('btn-enable-link').addEventListener('click', async ()=>{
      s.publicViewEnabled = true;
      ensureStudentToken(s);
      saveStudents();
      await pushPublicView(studentId);
      openStudentLinkModal(studentId);
    });
  }
}
/* ---------------- 學生自助查詢頁面（免登入） ---------------- */
async function initStudentView(token){
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'none';
  const view = document.getElementById('student-view');
  view.style.display = 'flex';
  const logoSrc = document.querySelector('.login-logo')?.getAttribute('src');
  if(logoSrc) document.getElementById('student-view-logo').innerHTML = `<img class="login-logo" src="${logoSrc}" alt="PUPIE S&C STUDIO">`;
  const content = document.getElementById('student-view-content');
  content.innerHTML = '<div class="hint" style="text-align:center;margin-top:20px;">載入中...</div>';
  if(!initFirebaseApp()){
    content.innerHTML = '<div class="hint" style="text-align:center;margin-top:20px;">系統尚未設定完成，請聯絡教練。</div>';
    return;
  }
  try{
    const db = firebase.firestore();
    const ref = db.collection('public_student_view').doc(token);
    const doc = await ref.get();
    if(!doc.exists){
      content.innerHTML = '<div class="hint" style="text-align:center;margin-top:20px;">找不到資料，請確認連結是否正確，或聯絡教練重新產生連結。</div>';
      return;
    }
    renderStudentViewContent(doc.data());
    ref.onSnapshot(snap => { if(snap.exists) renderStudentViewContent(snap.data()); });
  }catch(e){
    content.innerHTML = '<div class="hint" style="text-align:center;margin-top:20px;">載入失敗，請稍後再試。</div>';
  }
}
function renderStudentViewContent(data){
  const content = document.getElementById('student-view-content');
  const remaining = data.remaining;
  const color = remaining<=0 ? 'var(--red)' : (remaining<=2 ? 'var(--amber)' : 'var(--ink)');
  const nextClassText = data.nextClass ? fmtDateTime(data.nextClass) : '目前沒有排定課程';
  const historyHtml = (data.recentCheckins||[]).length===0
    ? '<div class="empty-state">尚無簽到紀錄</div>'
    : data.recentCheckins.map(ts=>`<div class="sched-item"><div class="when">${fmtDateTime(ts)}</div></div>`).join('');
  content.innerHTML = `
    <div class="sub" style="text-align:center;margin-bottom:4px;">${esc(data.name||'')} 的課程狀況</div>
    <div style="text-align:center;margin:20px 0;">
      <div class="mono" style="font-size:48px;font-weight:700;color:${color};">${remaining}</div>
      <div class="hint">剩餘堂數</div>
    </div>
    <div class="field"><label>下次上課時間</label><div style="font-size:15px;">${nextClassText}</div></div>
    <div class="field" style="margin-top:16px;"><label>簽到歷史</label></div>
    <div style="max-height:220px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;padding:2px 12px;">${historyHtml}</div>
    <div class="hint" style="text-align:center;margin-top:16px;">重新整理即可看到最新資料</div>
  `;
}

/* ---------------- Face ID／指紋解鎖 ---------------- */
const FACELOCK_ENABLED_KEY = 'pupie_facelock_enabled';
const FACELOCK_CRED_KEY = 'pupie_facelock_cred';

function isWebAuthnSupported(){
  return !!(window.PublicKeyCredential && navigator.credentials && navigator.credentials.create);
}
function isFacelockEnabled(){
  return localStorage.getItem(FACELOCK_ENABLED_KEY) === 'true' && !!localStorage.getItem(FACELOCK_CRED_KEY);
}
function randomChallenge_(){
  const arr = new Uint8Array(32);
  crypto.getRandomValues(arr);
  return arr;
}
function bufToBase64_(buf){
  return btoa(String.fromCharCode(...new Uint8Array(buf)));
}
function base64ToBuf_(b64){
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}
async function registerFacelock(){
  if(!isWebAuthnSupported()){
    alert('這個裝置或瀏覽器不支援 Face ID／指紋解鎖功能。');
    return false;
  }
  try{
    const userId = new Uint8Array(16);
    crypto.getRandomValues(userId);
    const cred = await navigator.credentials.create({
      publicKey: {
        challenge: randomChallenge_(),
        rp: { name: 'PUPIE 教練系統' },
        user: {
          id: userId,
          name: (fbUser && fbUser.email) || 'coach',
          displayName: (fbUser && fbUser.email) || 'coach'
        },
        pubKeyCredParams: [{ type:'public-key', alg:-7 }, { type:'public-key', alg:-257 }],
        authenticatorSelection: { authenticatorAttachment:'platform', userVerification:'required' },
        timeout: 60000
      }
    });
    localStorage.setItem(FACELOCK_CRED_KEY, bufToBase64_(cred.rawId));
    localStorage.setItem(FACELOCK_ENABLED_KEY, 'true');
    return true;
  }catch(err){
    console.error(err);
    alert('設定失敗，請確認裝置已開啟 Face ID／指紋辨識，再試一次。');
    return false;
  }
}
async function verifyFacelock(){
  const credId = localStorage.getItem(FACELOCK_CRED_KEY);
  if(!credId) return true;
  try{
    await navigator.credentials.get({
      publicKey: {
        challenge: randomChallenge_(),
        allowCredentials: [{ id: base64ToBuf_(credId), type:'public-key' }],
        userVerification: 'required',
        timeout: 60000
      }
    });
    return true;
  }catch(err){
    console.error(err);
    return false;
  }
}
function disableFacelock(){
  localStorage.removeItem(FACELOCK_ENABLED_KEY);
  localStorage.removeItem(FACELOCK_CRED_KEY);
}
function showFacelockScreen(onUnlocked){
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'none';
  const screen = document.getElementById('facelock-screen');
  screen.style.display = 'flex';
  const errEl = document.getElementById('facelock-error');
  errEl.textContent = '';

  const tryUnlock = async ()=>{
    errEl.textContent = '';
    const ok = await verifyFacelock();
    if(ok){
      screen.style.display = 'none';
      onUnlocked();
    } else {
      errEl.textContent = '驗證失敗，請再試一次，或改用密碼登入。';
    }
  };

  document.getElementById('facelock-unlock-btn').onclick = tryUnlock;
  document.getElementById('facelock-password-btn').onclick = ()=>{
    screen.style.display = 'none';
    skipFacelockOnce = true;
    doLogout();
  };

  // 嘗試自動觸發一次（部分瀏覽器需要使用者按按鈕才能啟動，失敗沒關係，使用者可自行按按鈕）
  tryUnlock();
}

/* ---------------- 啟動 ---------------- */
async function init(){
  const studentToken = new URLSearchParams(location.search).get('student');
  if(studentToken){
    await initStudentView(studentToken);
    return;
  }
  document.getElementById('btn-logout').addEventListener('click', doLogout);

  const usingFirebase = initFirebaseApp();
  if(usingFirebase){
    renderFirebaseAuthScreen();
    firebase.auth().onAuthStateChanged(async (user)=>{
      if(user){
        fbUser = user;
        fbReady = true;
        await loadAll();
        const proceedToApp = ()=>{
          document.getElementById('login-screen').style.display = 'none';
          document.getElementById('facelock-screen').style.display = 'none';
          document.getElementById('app').style.display = 'flex';
          state.tab = 'dashboard';
          renderNav();
          renderView();
        };
        if(isFacelockEnabled() && !skipFacelockOnce){
          showFacelockScreen(proceedToApp);
        } else {
          skipFacelockOnce = false;
          proceedToApp();
        }
      } else {
        fbReady = false;
        fbUser = null;
        fbUnsubscribers.forEach(u=>{ try{ u(); }catch(e){} });
        fbUnsubscribers.length = 0;
        state.loaded = false;
        document.getElementById('app').style.display = 'none';
        document.getElementById('login-screen').style.display = 'flex';
      }
    });
  } else {
    renderLegacyLoginScreen();
    await loadAll();
  }
}
init();
